<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GoodBingo UI</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background-color: #0b132b; color: white; display: flex; flex-direction: column; height: 100vh; }

        /* Top Header Stats */
        .top-bar { display: flex; justify-content: space-between; align-items: center; padding: 10px; background: #1c2541; }
        .stat-val { color: #48cae4; font-weight: bold; }
        .derash-val { color: #2ec4b6; font-weight: bold; font-size: 18px; }

        /* Main Game Layout */
        .game-area { display: flex; flex: 1; overflow: hidden; position: relative; }

        /* Left Side: 1-75 Called Grid */
        .left-board { width: 35%; background: #0f172a; padding: 5px; display: grid; grid-template-columns: repeat(5, 1fr); gap: 2px; font-size: 11px; text-align: center; overflow-y: auto; }
        .board-cell { background: #1e293b; padding: 4px; border-radius: 3px; color: #94a3b8; }
        .board-cell.called { background: #10b981; color: white; font-weight: bold; }

        /* Right Side: Player Cards & Current Ball */
        .right-area { width: 65%; padding: 10px; display: flex; flex-direction: column; align-items: center; overflow-y: auto; }
        
        .current-ball-container { width: 80px; height: 80px; background: #7209b7; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: bold; border: 4px solid #f72585; margin-bottom: 10px; }

        /* Card Styling */
        .bingo-card { background: white; color: black; border-radius: 10px; padding: 8px; width: 100%; max-width: 250px; margin-bottom: 10px; }
        .card-hdr { display: grid; grid-template-columns: repeat(5, 1fr); text-align: center; font-weight: bold; color: white; margin-bottom: 4px; }
        .hdr-b { background: #2563eb; } .hdr-i { background: #dc2626; } .hdr-n { background: #eab308; } .hdr-g { background: #16a34a; } .hdr-o { background: #9333ea; }
        
        .card-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 3px; text-align: center; }
        .c-cell { background: #f1f5f9; padding: 6px 0; font-weight: bold; border-radius: 4px; font-size: 14px; }
        .c-cell.marked { background: #10b981 !important; color: white; }

        /* Winner Popup Modal */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); justify-content: center; align-items: center; }
        .modal-content { background: white; color: #000; padding: 20px; border-radius: 15px; text-align: center; width: 85%; max-width: 320px; }
        .win-title { color: #d97706; font-size: 22px; margin-bottom: 10px; }
    </style>
</head>
<body>

    <!-- Header -->
    <div class="top-bar">
        <div>DERASH: <span class="derash-val" id="derash-display">0 ETB</span></div>
        <div>PLAYERS: <span class="stat-val" id="players-count">0</span></div>
        <div>TIME: <span class="stat-val" id="timer-display">15s</span></div>
    </div>

    <!-- Game Area -->
    <div class="game-area">
        <!-- በግራ በኩል 1-75 ቦርድ -->
        <div class="left-board" id="left-board"></div>

        <!-- በቀኝ በኩል ጥሪ እና የካርቴላዎች ቦታ -->
        <div class="right-area">
            <div class="current-ball-container" id="current-ball">--</div>
            <button onclick="buyCard()" style="padding: 8px 15px; background: #3b82f6; color: white; border: none; border-radius: 6px; margin-bottom: 10px; font-weight: bold;">ካርቴላ ምረጥ (+10 ETB)</button>
            <div id="cards-container" style="width: 100%;"></div>
        </div>
    </div>

    <!-- Winner Modal -->
    <div class="modal" id="winner-modal">
        <div class="modal-content">
            <h2 class="win-title">🏆 አሸናፊዎች!</h2>
            <p id="winner-info" style="font-size: 16px; margin: 10px 0;"></p>
            <h3 style="color: #059669;" id="winner-prize"></h3>
        </div>
    </div>

    <script>
        const socket = io();
        let myPlayerId = "User_" + Math.floor(Math.random() * 1000);

        // 1-75 Left Board መሳል
        const leftBoard = document.getElementById("left-board");
        for (let i = 1; i <= 75; i++) {
            leftBoard.innerHTML += `<div class="board-cell" id="b-cell-${i}">${i}</div>`;
        }

        function buyCard() {
            socket.emit("join_game", { player_id: myPlayerId });
        }

        socket.on("update_state", (state) => {
            document.getElementById("derash-display").innerText = state.derash + " ETB";
            document.getElementById("players-count").innerText = Object.keys(state.players_cards).length;
            document.getElementById("timer-display").innerText = state.countdown + "s";

            // የእኔን ካርቴላዎች መሳል
            if (state.players_cards[myPlayerId]) {
                renderMyCards(state.players_cards[myPlayerId]);
            }
        });

        socket.on("number_called", (data) => {
            document.getElementById("current-ball").innerText = data.ball;
            
            // የግራ ሰሌዳ ላይ ማብራት
            const bCell = document.getElementById(`b-cell-${data.ball}`);
            if (bCell) bCell.classList.add("called");

            // በካርቴላዬ ላይ ካለ ማቅለም
            document.querySelectorAll(`[data-num='${data.ball}']`).forEach(el => {
                el.classList.add("marked");
            });
        });

        socket.on("game_over", (res) => {
            const modal = document.getElementById("winner-modal");
            document.getElementById("winner-info").innerText = res.winners.map(w => `${w.player} (ካርቴላ #${w.card_id})`).join(", ");
            document.getElementById("winner-prize").innerText = `ክፍያ፦ ${res.prize} ETB`;
            modal.style.display = "flex";

            setTimeout(() => { modal.style.display = "none"; }, 8000);
        });

        function renderMyCards(cards) {
            const container = document.getElementById("cards-container");
            container.innerHTML = "";
            cards.forEach(card => {
                let html = `
                    <div class="bingo-card">
                        <div class="card-hdr"><span class="hdr-b">B</span><span class="hdr-i">I</span><span class="hdr-n">N</span><span class="hdr-g">G</span><span class="hdr-o">O</span></div>
                        <div class="card-grid">
                `;
                card.grid.forEach(row => {
                    row.forEach(val => {
                        const isFree = val === 0;
                        html += `<div class="c-cell ${isFree ? 'marked':''}" data-num="${val}">${isFree ? '★' : val}</div>`;
                    });
                });
                html += `</div></div>`;
                container.innerHTML += html;
            });
        }
    </script>
</body>
</html>
