<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BK Bingo House Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            user-select: none;
        }

        body {
            background-color: #172131;
            color: #ffffff;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* Top Header Stats */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-width: 480px;
            margin-bottom: 12px;
            gap: 6px;
        }

        .stat-box {
            background: #233044;
            border-radius: 8px;
            padding: 6px 10px;
            text-align: center;
            flex: 1;
        }

        .stat-label {
            font-size: 10px;
            color: #899fb8;
            font-weight: bold;
        }

        .stat-value {
            font-size: 13px;
            font-weight: bold;
            color: #ffffff;
        }

        .room-tag {
            background: #facc15;
            color: #000000;
            font-size: 11px;
            font-weight: bold;
            padding: 8px 10px;
            border-radius: 8px;
        }

        .balance-tag {
            background: #10b981;
            color: #ffffff;
            font-size: 12px;
            font-weight: bold;
            padding: 8px 12px;
            border-radius: 8px;
        }

        /* Called Numbers Board (1-88 Grid) */
        .board-container {
            width: 100%;
            max-width: 480px;
            background: #233044;
            border-radius: 12px;
            padding: 8px;
            margin-bottom: 15px;
        }

        .board-grid {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            gap: 4px;
        }

        .board-num {
            background: #1e293b;
            color: #64748b;
            font-size: 11px;
            font-weight: bold;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
        }

        .board-num.called {
            background: #cbd5e1;
            color: #0f172a;
        }

        .board-num.current {
            background: #10b981;
            color: #ffffff;
            box-shadow: 0 0 8px #10b981;
        }

        /* Selected Player Cards */
        .cards-container {
            display: flex;
            gap: 10px;
            width: 100%;
            max-width: 480px;
            overflow-x: auto;
            padding-bottom: 10px;
        }

        .card-wrapper {
            position: relative;
            background: #ffffff;
            border-radius: 12px;
            padding: 8px;
            min-width: 200px;
            flex: 1;
            border: 2px solid #10b981;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4px;
        }

        .card-id {
            color: #2563eb;
            font-weight: bold;
            font-size: 14px;
        }

        .close-btn {
            background: #ef4444;
            color: white;
            border: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            font-weight: bold;
            font-size: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 3px;
        }

        .cell {
            background: #ffffff;
            color: #0f172a;
            border: 1px solid #cbd5e1;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 12px;
            border-radius: 4px;
        }

        .cell.star {
            color: #f59e0b;
            font-size: 14px;
        }

        .cell.matched {
            background: #10b981 !important;
            color: #ffffff !important;
        }

        .controls {
            width: 100%;
            max-width: 480px;
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            text-align: center;
        }

        .btn-add {
            background: #3b82f6;
            color: white;
        }

        .btn-bingo {
            background: #eab308;
            color: black;
        }
    </style>
</head>
<body>

    <!-- Top Stats Bar -->
    <div class="header">
        <div class="room-tag" id="roomName">ROOM VIP 💰</div>
        <div class="stat-box">
            <div class="stat-label">SOLD</div>
            <div class="stat-value" id="soldCount">12</div>
        </div>
        <div class="stat-box">
            <div class="stat-label">TIME</div>
            <div class="stat-value" id="timeCount">7s</div>
        </div>
        <div class="stat-box">
            <div class="stat-label">CALL</div>
            <div class="stat-value" id="callCount">0</div>
        </div>
        <div class="balance-tag" id="balDisplay">260.00 ETB</div>
    </div>

    <!-- Main Board 1-88 -->
    <div class="board-container">
        <div class="board-grid" id="mainBoard"></div>
    </div>

    <!-- Cards Container -->
    <div class="cards-container" id="cardsContainer"></div>

    <!-- Controls -->
    <div class="controls">
        <button class="btn btn-add" onclick="addNewCard()">➕ አዲስ ካርቴላ ጨምር</button>
        <button class="btn btn-bingo" onclick="checkBingo()">🎉 BINGO!</button>
    </div>

    <script>
        const tg = window.Telegram ? window.Telegram.WebApp : null;
        if(tg) tg.expand();

        const urlParams = new URLSearchParams(window.location.search);
        const userBal = parseFloat(urlParams.get('bal')) || 260.00;
        document.getElementById('balDisplay').innerText = userBal.toFixed(2) + " ETB";

        // Render 1-88 Main Grid
        const mainBoard = document.getElementById('mainBoard');
        for (let i = 1; i <= 88; i++) {
            let div = document.createElement('div');
            div.className = 'board-num';
            div.id = 'num-' + i;
            div.innerText = i;
            mainBoard.appendChild(div);
        }

        // Generate Unique Numbers for Each Card
        function generateUniqueGrid() {
            let used = new Set();
            let grid = [];

            function getUniqueNum(min, max) {
                let n;
                do {
                    n = Math.floor(Math.random() * (max - min + 1)) + min;
                } while (used.has(n));
                used.add(n);
                return n;
            }

            for (let r = 0; r < 5; r++) {
                let row = [];
                for (let c = 0; c < 5; c++) {
                    if (r === 2 && c === 2) {
                        row.push("⭐");
                    } else {
                        let min = (c * 17) + 1;
                        let max = (c + 1) * 17;
                        row.push(getUniqueNum(min, max));
                    }
                }
                grid.push(row);
            }
            return grid;
        }

        let playerCards = [];

        function addNewCard(specificId = null) {
            if (playerCards.length >= 4) {
                alert("ከ 4 በላይ ካርቴላ መግዛት አይችሉም!");
                return;
            }
            let cardId = specificId || Math.floor(Math.random() * 88) + 1;
            let cardNumbers = generateUniqueGrid();

            playerCards.push({ id: cardId, grid: cardNumbers });
            renderCards();
        }

        function renderCards() {
            const container = document.getElementById('cardsContainer');
            container.innerHTML = '';

            playerCards.forEach((card, cardIndex) => {
                let cardWrapper = document.createElement('div');
                cardWrapper.className = 'card-wrapper';

                let cardHeader = `
                    <div class="card-header">
                        <span class="card-id">#${card.id}</span>
                        <button class="close-btn" onclick="removeCard(${cardIndex})">✕</button>
                    </div>
                `;

                let gridHtml = '<div class="card-grid">';
                for (let r = 0; r < 5; r++) {
                    for (let c = 0; c < 5; c++) {
                        let val = card.grid[r][c];
                        let isStar = (val === "⭐") ? "star" : "";
                        gridHtml += `<div class="cell ${isStar}">${val}</div>`;
                    }
                }
                gridHtml += '</div>';

                cardWrapper.innerHTML = cardHeader + gridHtml;
                container.appendChild(cardWrapper);
            });
        }

        function removeCard(index) {
            playerCards.splice(index, 1);
            renderCards();
        }

        function checkBingo() {
            alert("ቢንጎ ፍተሻ በመደረግ ላይ ነው...");
        }

        // Default 2 Cards
        addNewCard(64);
        addNewCard(36);
    </script>
</body>
</html>
