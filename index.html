<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GoodBingo Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1a233a;
            color: white;
            margin: 0;
            padding: 10px;
            text-align: center;
        }
        .header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
        }
        .card {
            background: #283556;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 12px;
        }
        .grid-container {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            gap: 5px;
            max-height: 350px;
            overflow-y: auto;
            background: #202b46;
            padding: 10px;
            border-radius: 12px;
        }
        .grid-item {
            background: #ffffff;
            color: #000;
            padding: 10px 0;
            border-radius: 6px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
        }
        .grid-item.selected {
            background: #20bf6b;
            color: white;
        }
        .grid-item.taken {
            background: #a5b1c2;
            color: #778ca3;
            cursor: not-allowed;
        }
        .call-box {
            margin-top: 15px;
            background: #eb4d4b;
            padding: 15px;
            border-radius: 12px;
            font-size: 22px;
            font-weight: bold;
        }
        .bingo-btn {
            margin-top: 15px;
            width: 100%;
            padding: 15px;
            background: #f7b731;
            border: none;
            color: #000;
            font-size: 20px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="card" style="background:#f1c40f; color:#000;">ROOM<br><b>VIP 💰</b></div>
        <div class="card">SOLD<br><b id="sold-count">0</b></div>
        <div class="card">TIME<br><b id="timer">30s</b></div>
        <div class="card" style="background:#2ecc71;">BALANCE<br><b>0.00 ETB</b></div>
    </div>

    <div class="grid-container" id="grid"></div>

    <div class="call-box" id="caller-box">
        የተጠራ ቁጥር: <span id="current-number">--</span>
    </div>

    <button class="bingo-btn" onclick="claimBingo()">🔥 BINGO!</button>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand(); // Mini App ሙሉ ስክሪን እንዲሆን

        let selectedBoard = null;

        // 1 እስከ 100 ቦርዶችን ማመንጨት
        const grid = document.getElementById('grid');
        for (let i = 1; i <= 100; i++) {
            let item = document.createElement('div');
            item.className = 'grid-item';
            item.innerText = i;
            item.onclick = () => selectBoard(i, item);
            grid.appendChild(item);
        }

        function selectBoard(num, element) {
            if (selectedBoard) return;
            selectedBoard = num;
            element.classList.add('selected');
            document.getElementById('sold-count').innerText = 1;
            tg.sendData(JSON.stringify({ action: "board_selected", board: num }));
        }

        function claimBingo() {
            if (!selectedBoard) {
                alert("እባክዎ በመጀመሪያ ቦርድ ይምረጡ!");
                return;
            }
            alert("ቢንጎ ብለዋል! ሰርቨሩ እያረጋገጠ ነው...");
        }
    </script>
</body>
</html>
