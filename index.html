<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GoodBingo Mini App</title>
    <!-- Telegram WebApp & Socket.io SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; }
        body { background-color: #0b132b; color: white; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

        /* Top Bar Header */
        .top-bar { display: flex; justify-content: space-between; align-items: center; padding: 10px 12px; background: #1c2541; border-bottom: 2px solid #3a506b; }
        .stat-label { font-size: 11px; color: #94a3b8; display: block; }
        .stat-val { color: #48cae4; font-weight: bold; font-size: 14px; }
        .derash-val { color: #2ec4b6; font-weight: bold; font-size: 16px; }

        /* Game Layout */
        .game-area { display: flex; flex: 1; overflow: hidden; }

        /* Left Side: Called Numbers Board (1-75) */
        .left-board { width: 38%; background: #0f172a; padding: 6px; display: grid; grid-template-columns: repeat(5, 1fr); gap: 3px; font-size: 10px; text-align: center; overflow-y: auto; border-right: 1px solid #1e293b; }
        .board-cell { background: #1e293b; padding: 6px 0; border-radius: 4px; color: #64748b; font-weight: 500; }
        .board-cell.called { background: #10b981 !important; color: white !important; font-weight: bold; box-shadow: 0 0 5px #10b981; }

        /* Right Side: Ball & Cards */
        .right-area { width: 62%; padding: 10px; display: flex; flex-direction: column; align-items: center; overflow-y: auto; }
        
        .current-ball-container { width: 70px; height: 70px; background: radial-gradient(circle, #7209b7 0%, #3a0ca3 100%); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: bold; border: 3px solid #f72585; margin-bottom: 8px; box-shadow: 0 0 10px rgba(247, 37, 133, 0.4); }

        .btn-buy { width: 100%; max-width: 240px; padding: 10px; background: #2563eb; color: white; border: none; border-radius: 8px; margin-bottom: 12px; font-weight: bold; font-size: 14px; cursor: pointer; transition: 0.2s; }
        .btn-buy:active { transform: scale(0.98); background: #1d4ed8; }

        /* Card Layout */
        .bingo-card { background: #ffffff; color: #1e293b; border-radius: 8px; padding: 6px; width: 100%; max-width: 240px; margin-bottom: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .card-hdr { display: grid; grid-template-columns: repeat(5, 1fr); text-align: center; font-weight: bold; color: white; margin-bottom: 4px; border-radius: 4px; overflow: hidden; font-size: 12px; }
        .hdr-b { background: #2563eb; } .hdr-i { background: #dc2626; } .hdr-n { background: #d97706; } .hdr-g { background: #16a34a; } .hdr-o { background: #9333ea; }
        
        .card-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 2px; text-align: center; }
        
        /* ቁጥር ሲጠራ የሚያበራው/ሚያጥቁረው CSS ክፍል */
        .c-cell { background: #f1f5f9; padding: 8px 0; font-weight: bold; border-radius: 3px; font-size: 13px; color: #0f172a; transition: background-color 0.2s ease; }
        .c-cell.marked { background-color: #10b981 !important; color: white !important; font-weight: bold; }

        /* Winner Modal */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); justify-content: center; align-items: center; z-index: 100; }
        .modal-content { background: white; color: #0f172a; padding: 20px; border-radius: 12px; text-align: center; width: 85%; max-width: 300px; }
        .win-title { color: #d97706; font-size: 20px; margin-bottom: 8px; }
    </style>
</head>
<body>

    <!-- Header Stats -->
    <div class="top-bar">
        <div>
            <span class="stat-label">ድራሽ (DERASH)</span>
            <span class="derash-val" id="derash-display">0 ETB</span>
        </div>
        <div>
            <span class="stat-label">ተጫዋቾች</span>
            <span class="stat-val" id="players-count">0</span>
        </div>
        <div>
            <span class="stat-label">ቀሪ ጊዜ</span>
            <span class="stat-val" id="timer-display">15s</span>
        </div>
    </div>

    <!-- Game Area -->
    <div class="game-area">
        <!-- 1-75 Called Board -->
        <div class="left-board" id="left-board"></div>

        <!-- Call Ball & Player Cards -->
        <div class="right-area">
            <div class="current-ball-container" id="current-ball">--</div>
            <button class="btn-buy" onclick="buyCard()">ካርቴላ ምረጥ (10 ETB)</button>
            <div id="cards-container" style="width: 100%; display: flex; flex-direction: column; align-items: center;"></div>
        </div>
    </div>

    <!-- Winner Modal -->
    <div class="modal" id="winner-modal">
        <div class="modal-content">
            <h2 class="win-title">🏆 አሸናፊ!</h2>
            <p id="winner-info" style="font-size: 15px; margin: 10px 0;"></p>
            <h3 style="color: #059669;" id="winner-prize"></h3>
        </div>
    </div>

    <script>
        const socket = io();
        const tg = window.Telegram ? window.Telegram.WebApp : null;

        // የወጡ ቁጥሮችን ታሪክ መዝግቦ መያዣ (State Re-render ሲሆን እንዳይጠፉ)
        let calledNumbersHistory = new Set();

        // የቴሌግራም ተጠቃሚ ID ማግኘት
        let myPlayerId = "User_" + Math.floor(Math.random() * 1000);
        if (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) {
            tg.expand();
            myPlayerId = tg.initDataUnsafe.user.username || "ID_" + tg.initDataUnsafe.user.id;
        }

        // 1-75 Left Board መሳል
        const leftBoard = document.getElementById("left-board");
        for (let i = 1; i <= 75; i++) {
            leftBoard.innerHTML += `<div class="board-cell" id="b-cell-${i}">${i}</div>`;
        }

        // ካርቴላ መግዣ ተግባር
        function buyCard() {
            socket.emit("join_game", { 
                player_id: myPlayerId,
                card_price: 10,
                commission: 2
            });
        }

        // የጨዋታው ሁኔታ ሲቀየር (State Update)
        socket.on("update_state", (state) => {
            document.getElementById("derash-display").innerText = state.derash + " ETB";
            document.getElementById("players-count").innerText = Object.keys(state.players_cards || {}).length;
            document.getElementById("timer-display").innerText = state.countdown + "s";

            // ከሰርቨር የመጡት የወጡ ቁጥሮች ካሉ በታሪክ ውስጥ መመዝገብ
            if (state.called_numbers && Array.isArray(state.called_numbers)) {
                state.called_numbers.forEach(num => {
                    const strNum = String(num);
                    calledNumbersHistory.add(strNum);
                    
                    // የግራ ቦርድ ላይ ማብራት
                    const bCell = document.getElementById(`b-cell-${strNum}`);
                    if (bCell) bCell.classList.add("called");
                });
            }

            // የኔን ካርቴላዎች መሳል
            if (state.players_cards && state.players_cards[myPlayerId]) {
                renderMyCards(state.players_cards[myPlayerId]);
            }
        });

        // አዲስ ቁጥር በቦቱ ሲጠራ (Number Called Event)
        socket.on("number_called", (data) => {
            const ballValue = String(data.ball);
            document.getElementById("current-ball").innerText = ballValue;
            
            // ታሪክ ውስጥ መመዝገብ
            calledNumbersHistory.add(ballValue);

            // 1. በግራ በኩል ባለው 1-75 ሰሌዳ ላይ ማብራት
            const bCell = document.getElementById(`b-cell-${ballValue}`);
            if (bCell) {
                bCell.classList.add("called");
            }

            // 2. በካርቴላዎች ላይ ቁጥሩ ሲመጣ ማጥቆር (String Conversion ማረጋገጫ)
            const cardCells = document.querySelectorAll(`.c-cell[data-num='${ballValue}']`);
            cardCells.forEach(el => {
                el.classList.add("marked");
            });
        });

        // ጨዋታው ሲያልቅ አሸናፊውን ማሳያ
        socket.on("game_over", (res) => {
            const modal = document.getElementById("winner-modal");
            document.getElementById("winner-info").innerText = res.winners.map(w => `${w.player} (ካርቴላ #${w.card_id})`).join(", ");
            document.getElementById("winner-prize").innerText = `ክፍያ፦ ${res.prize} ETB`;
            modal.style.display = "flex";

            // አዲስ ጨዋታ ሲጀምር ታሪክን ማፅዳት
            calledNumbersHistory.clear();
            document.querySelectorAll(".board-cell.called").forEach(el => el.classList.remove("called"));

            setTimeout(() => { modal.style.display = "none"; }, 8000);
        });

        // የካርቴላዎችን UI የመሳል ተግባር
        function renderMyCards(cards) {
            const container = document.getElementById("cards-container");
            container.innerHTML = "";
            
            cards.forEach(card => {
                let html = `
                    <div class="bingo-card">
                        <div class="card-hdr">
                            <span class="hdr-b">B</span><span class="hdr-i">I</span><span class="hdr-n">N</span><span class="hdr-g">G</span><span class="hdr-o">O</span>
                        </div>
                        <div class="card-grid">
                `;
                
                card.grid.forEach(row => {
                    row.forEach(val => {
                        const strVal = String(val);
                        const isFree = val === 0 || val === 'FREE';
                        
                        // ቁጥሩ ቀደም ብሎ ከተጠራ ወይም FREE ከሆነ marked እንዲሆን ማድረግ
                        const isMarked = isFree || calledNumbersHistory.has(strVal);

                        html += `<div class="c-cell ${isMarked ? 'marked':''}" data-num="${strVal}">${isFree ? '★' : val}</div>`;
                    });
                });
                
                html += `</div></div>`;
                container.innerHTML += html;
            });
        }
    </script>
</body>
</html>
