<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#4f46e5">
    <title>BKBINGO Pro - Dashboard</title>
    
    <!-- PWA Manifest Link -->
    <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">

    <style>
        body {
            background-color: #0f172a;
            color: #ffffff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .header-card {
            background: #1e293b;
            width: 100%;
            max-width: 400px;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            text-align: center;
        }
        .balance {
            font-size: 20px;
            font-weight: bold;
            color: #10b981;
            margin-top: 5px;
        }
        .grid-menu {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            width: 100%;
            max-width: 400px;
        }
        .btn {
            background: #1e293b;
            color: #ffffff;
            border: 1px solid #334155;
            padding: 15px 10px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
            transition: 0.2s;
        }
        .btn:hover {
            background: #334155;
        }
        .btn-primary {
            grid-column: span 2;
            background: #2563eb;
            border: none;
        }
        .btn-primary:hover {
            background: #1d4ed8;
        }
        .full-width {
            grid-column: span 2;
        }
    </style>
</head>
<body>

    <!-- የሰላምታ እና የሂሳብ መግለጫ ካርድ -->
    <div class="header-card">
        <h3 id="welcome-msg">ወደ BKBINGO Pro እንኳን ደህና መጡ! 🎲</h3>
        <p>ባለንብ (Balance):</p>
        <div class="balance" id="user-balance">198.00 ETB</div>
    </div>

    <!-- ዋና ዋና የሜኑ ቁልፎች (ልክ እንደ ቦቱ) -->
    <div class="grid-menu">
        <button class="btn btn-primary" onclick="openApp()">🎲 ጨዋታ ጀምር (Open App)</button>
        <button class="btn" onclick="openProfile()">👤 ፕሮፋይል / ባለንብ</button>
        <button class="btn" onclick="openDeposit()">📥 ዲፖዚት (Deposit)</button>
        <button class="btn" onclick="openWithdraw()">📤 ዊዝድሮ (Withdraw)</button>
        <button class="btn" onclick="openReferral()">👥 ሪፈራል / ግብዣ</button>
        <button class="btn" onclick="openHistory()">📜 የግብይት ታሪክ</button>
        <button class="btn" onclick="openHelp()">ℹ️ እርዳታ እና ህጎች</button>
        <button class="btn" onclick="openSupport()">🎧 የደንበኞች አገልግሎት</button>
    </div>

    <script>
        // Service Worker Registration for PWA / Mobile Support
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register("{{ url_for('static', filename='sw.js') }}")
                    .then(reg => console.log('Service Worker Registered Successfully!', reg))
                    .catch(err => console.log('Service Worker Registration Failed:', err));
            });
        }

        function openApp() {
            alert("የቢንጎ ጨዋታ ክፍፍል ወደ ሚጀምርበት ገጽ በመውሰድ ላይ...");
            // ወደ ጨዋታው ማዘዋወሪያ ኮድ እዚህ ይገባል
        }
        function openProfile() { alert("የተጠቃሚ ፕሮፋይል እና የኪስ ቦርሳ መረጃ"); }
        function openDeposit() { 
            let method = prompt("የክፍያ ዘዴ ይምረጡ:\n1. CBE BIRR\n2. TELE BIRR");
            if(method) alert(method + " በመጠቀም የገንዘብ ገቢ ማድረጊያ ገጽ ይከፈታል");
        }
        function openWithdraw() { alert("የገንዘብ ማውጫ (Withdraw) ፎርም"); }
        function openReferral() { alert("የእርስዎ የሪፈራል ሊንክ እና የኮሚሽን መረጃ"); }
        function openHistory() { alert("የባንክ እና የጨዋታ ታሪክ (History)"); }
        function openHelp() { alert("የBKBINGO Pro የጨዋታ ህጎች"); }
        function openSupport() { alert("ድጋፍ ለማግኘት @Support አግኙን"); }
    </script>
</body>
</html>
