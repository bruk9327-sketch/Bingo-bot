<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GoodBingo</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            user-select: none;
        }

        body {
            background-color: #0f172a;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Top Bar Info */
        .top-header {
            background: #1e293b;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 12px;
            font-size: 11px;
            font-weight: bold;
        }

        .derash-val { color: #22c55e; }
        .players-val { color: #f59e0b; }

        /* Main Game Layout Split Screen */
        .game-layout {
            display: flex;
            flex: 1;
            padding: 6px;
            gap: 6px;
            max-width: 500px;
            margin: 0 auto;
            width: 100%;
        }

        /* Left Side: Called Numbers Board (1-75) */
        .left-board {
            width: 38%;
            background: #ffffff;
            border-radius: 8px;
            padding: 4px;
            display: flex;
            flex-direction: column;
        }

        .bingo-header {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 2px;
            margin-bottom: 4px;
            text-align: center;
            font-weight: 900;
            font-size: 11px;
            color: white;
        }

        .b-head { background: #2563eb; }
        .i-head { background: #dc2626; }
        .n-head { background: #eab308; }
        .g-head { background: #16a34a; }
        .o-head { background: #9333ea; }

        .board-matrix {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 2px;
        }

        .board-cell {
            background: #f1f5f9;
            color: #0f172a;
            font-size: 10px;
            font-weight: bold;
            height: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 2px;
        }

        /* ሲስተሙ የጠራው ቁጥር በግራ ቦርድ ላይ አረንጓዴ ይሆናል */
        .board-cell.system-called {
            background: #16a34a !important;
            color: #ffffff !important;
        }

        /* Right Side: Player's Cards */
        .right-cards {
            width: 62%;
            display: flex;
            flex-direction: column;
            gap: 10px;
            position: relative;
        }

        /* Big Called Ball Display */
        .current-ball {
            position: absolute;
            top: -12px;
            right: 10px;
            background: #9333ea;
            color: white;
            width: 55px;
            height: 55px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            font-weight: 900;
            border: 3px solid white;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            z-index: 10;
        }

        .card-box {
            background: #ffffff;
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid #cbd5e1;
            margin-top: 35px;
        }

        .card-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 2px;
            padding: 6px;
        }

        .p-cell {
            background: #ffffff;
            color: #0f172a;
            border: 1px solid #cbd5e1;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 12px;
            border-radius: 4px;
            cursor: pointer;
        }

        .p-cell.star {
            color: #f59e0b;
            font-size: 14px;
        }

        /* ተጫዋቹ እራሱ የነካው ቁጥር (ማርክ ያደረገው) ጥቁር/ጨለማ ይሆናል */
        .p-cell.user-marked {
            background: #334155 !important;
            color: #ffffff !important;
        }

        /* BINGO! Button */
        .bingo-btn {
            background: #2563eb;
            color: white;
            text-align: center;
            padding: 8px 0;
            font-weight: 900;
            font-size: 18px;
            letter-spacing: 1px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 12px;
        }

        .card-no {
            font-size: 10px;
            opacity: 0.8;
        }
    </style>
</head>
<body>

    <!-- Header Bar -->
    <div class="top-header">
        <div>DERASH: <span class="derash-val" id="derashVal">1824 ETB</span></div>
        <div>BALLS: <span id="ballCount">0</span>/75</div>
        <div>PLAYERS: <span class="players-val">228</span></div>
    </div>

    <!-- Game Main View -->
    <div class="game-layout">
        
        <!-- Left 1-75 System Board -->
        <div class="left-board">
            <div class="bingo-header">
                <div class="b-head">B</div>
                <div class="i-head">I</div>
                <div class="n-head">N</div>
                <div class="g-head">G</div>
                <div class="o-head">O</div>
            </div>
            <div class="board-matrix" id="systemBoard"></div>
        </div>

        <!-- Right Player Cards Area -->
        <div class="right-cards">
            <!-- Current Call Floating Ball -->
            <div class="current-ball" id="currentBallDisplay">WAIT</div>

            <!-- Cards Container -->
            <div id="playerCardsContainer"></div>
        </div>

    </div>

    <script>
        const tg = window.Telegram ? window.Telegram.WebApp : null;
        if(tg) tg.expand();

        let userBalance = 280.00;
        let derashPot = 1824;
        let calledNumbers = new Set();
        let userSelectedCards = [80, 64]; // ተጫዋቹ የመረጣቸው ካርቴላዎች
        let userMarkedCells = {}; // ተጫዋቹ የነካቸውን ቁጥሮች መያዣ

        // 1. የግራ 1-75 ቦርድ መፍጠር (B:1-15, I:16-30...)
        const systemBoard = document.getElementById('systemBoard');
        for (let r = 0; r < 15; r++) {
            for (let c = 0; c < 5; c++) {
                let num = (c * 15) + (r + 1);
                let div = document.createElement('div');
                div.className = 'board-cell';
                div.id = 'sys-num-' + num;
                div.innerText = num;
                systemBoard.appendChild(div);
            }
        }

        // Seeded Unique Grid Generator
        function seededRandom(seed) {
            let x = Math.sin(seed++) * 10000;
            return x - Math.floor(x);
        }

        function generateUniqueGrid(cardId) {
            let ranges = [
                { min: 1, max: 15 }, { min: 16, max: 30 },
                { min: 31, max: 45 }, { min: 46, max: 60 }, { min: 61, max: 75 }
            ];
            let columns = [];
            let currentSeed = cardId * 997;

            ranges.forEach((range) => {
                let col = [];
                while (col.length < 5) {
                    let rand = seededRandom(currentSeed++);
                    let val = Math.floor(rand * (range.max - range.min + 1)) + range.min;
                    if (!col.includes(val)) col.push(val);
                }
                col.sort((a, b) => a - b);
                columns.push(col);
            });

            let grid = [];
            for (let r = 0; r < 5; r++) {
                let row = [];
                for (let c = 0; c < 5; c++) {
                    if (r === 2 && c === 2) row.push("★");
                    else row.push(columns[c][r]);
                }
                grid.push(row);
            }
            return grid;
        }

        // 2. የተጫዋቹን ካርቴላዎች መሳል
        function renderPlayerCards() {
            const container = document.getElementById('playerCardsContainer');
            container.innerHTML = '';

            userSelectedCards.forEach((cardId) => {
                if (!userMarkedCells[cardId]) userMarkedCells[cardId] = new Set(["★"]);

                let grid = generateUniqueGrid(cardId);
                let cardBox = document.createElement('div');
                cardBox.className = 'card-box';

                let gridHtml = '<div class="card-grid">';
                for (let r = 0; r < 5; r++) {
                    for (let c = 0; c < 5; c++) {
                        let val = grid[r][c];
                        let isStar = (val === "★") ? "star" : "";
                        let isUserMarked = userMarkedCells[cardId].has(val) ? "user-marked" : "";

                        gridHtml += `<div class="p-cell ${isStar} ${isUserMarked}" onclick="markCell(${cardId}, '${val}')">${val}</div>`;
                    }
                }
                gridHtml += '</div>';

                let bingoBtn = `
                    <div class="bingo-btn" onclick="claimBingo(${cardId})">
                        <span>BINGO!</span>
                        <span class="card-no">#${cardId}</span>
                    </div>
                `;

                cardBox.innerHTML = gridHtml + bingoBtn;
                container.appendChild(cardBox);
            });
        }

        // ተጫዋቹ ቁጥር ሲነካ ያጥቁረዋል/ያነሳዋል
        function markCell(cardId, val) {
            if (val === "★") return;
            if (userMarkedCells[cardId].has(val)) {
                userMarkedCells[cardId].delete(val);
            } else {
                userMarkedCells[cardId].add(val);
            }
            renderPlayerCards();
        }

        // 3. የቁጥሮች ጥሪ (Auto Caller)
        function startCallSystem() {
            let callInterval = setInterval(() => {
                if (calledNumbers.size >= 75) {
                    clearInterval(callInterval);
                    return;
                }

                let nextNum;
                do {
                    nextNum = Math.floor(Math.random() * 75) + 1;
                } while (calledNumbers.has(nextNum));

                calledNumbers.add(nextNum);

                // የግራ ቦርድ ላይ አረንጓዴ ማብራት
                let sysCell = document.getElementById('sys-num-' + nextNum);
                if (sysCell) sysCell.classList.add('system-called');

                // ከላይ ትልቁን ቦል ማሳየት
                let letter = nextNum <= 15 ? 'B' : nextNum <= 30 ? 'I' : nextNum <= 45 ? 'N' : nextNum <= 60 ? 'G' : 'O';
                document.getElementById('currentBallDisplay').innerText = `${letter}-${nextNum}`;
                document.getElementById('ballCount').innerText = calledNumbers.size;

            }, 3000); // በየ 3 ሰከንዱ ቁጥር ይጠራል
        }

        // 4. BINGO! ቁልፍ ሲጫን አሸናፊነት ማረጋገጥ
        function claimBingo(cardId) {
            let userMarked = userMarkedCells[cardId];
            let isValid = true;

            // ተጫዋቹ ያጠቆራቸው ቁጥሮች በሙሉ በሲስተሙ የተጠሩ መሆናቸውን ማረጋገጥ
            userMarked.forEach(num => {
                if (num !== "★" && !calledNumbers.has(parseInt(num))) {
                    isValid = false;
                }
            });

            if (userMarked.size >= 5 && isValid) {
                userBalance += derashPot; // ብሩ ወደ አካውንቱ ይደመራል
                alert(`🎉 እንኳን ደስ አለዎት! # ${cardId} ካርቴላ አሸንፏል። ${derashPot} ETB ወደ አካውንትዎ ተጨምሯል!`);
                location.reload();
            } else {
                alert("❌ ገና አልሞላህም ወይም ያልወጣ ቁጥር አጥቁረሃል! እባክህ በትክክል አረጋግጥ።");
            }
        }

        // Initialize Game
        renderPlayerCards();
        startCallSystem();
    </script>
</body>
</html>
