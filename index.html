<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ካርቴላ መረጫ</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-white min-h-screen p-4">

    <div class="max-w-4xl mx-auto">
        <h1 class="text-2xl font-bold mb-6 text-center text-purple-400">ካርቴላ መረጫ</h1>
        
        <!-- ካርቴላዎች የሚቀመጡበት ግሪድ -->
        <div id="cartela-grid" class="grid grid-cols-4 sm:grid-cols-8 md:grid-cols-13 gap-2">
            <!-- አዝራሮች እዚህ በጃቫስክሪፕት ይፈጠራሉ -->
        </div>
    </div>

    <script>
        // ለሙከራ የሚሆኑ ተለዋዋጮች (ከሴርቨር የሚመጡትን እነዚህን መጠቀም ይቻላል)
        let mySelectedCards = []; 
        let takenCards = []; 
        const userId = "user123";

        // የካርቴላ ግሪድን የሚፈጥር ፈንክሽን
        function initCartelaGrid() {
            const gridContainer = document.getElementById('cartela-grid');
            
            // መፍትሄ፡ DOM-ው ገና ካልተጫነ ትንሽ ቆይቶ እንደገና ይሞክራል
            if (!gridContainer) {
                setTimeout(initCartelaGrid, 100);
                return;
            }

            gridContainer.innerHTML = ''; // ማጽጃ

            for (let i = 1; i <= 104; i++) {
                const btn = document.createElement('button');
                const isSelected = mySelectedCards.includes(i);
                const isTaken = takenCards.includes(i) && !isSelected;

                if (isTaken) {
                    btn.className = 'p-2 text-xs font-black rounded-xl border bg-slate-900 text-slate-600 border-slate-800 cursor-not-allowed';
                    btn.disabled = true;
                } else if (isSelected) {
                    btn.className = 'p-2 text-xs font-black rounded-xl border bg-purple-600 text-white border-purple-400 shadow-lg cursor-pointer';
                } else {
                    btn.className = 'p-2 text-xs font-black rounded-xl border bg-slate-800/80 text-slate-200 border-slate-700/60 active:scale-95 cursor-pointer';
                    btn.onclick = () => {
                        if (mySelectedCards.length >= 2) {
                            alert("⚠️ በአንድ ዙር ቢበዛ 2 ካርቴላ ብቻ መግዛት ይቻላል!");
                            return;
                        }
                        // እዚህ ቦታ ላይ socket.emit('select_card', ...) ማስገባት ይቻላል
                        console.log("ካርቴላ ተመረጠ፡ " + i);
                        mySelectedCards.push(i);
                        initCartelaGrid(); // አፕዴት ለማድረግ
                    };
                }
                btn.innerText = i;
                gridContainer.appendChild(btn);
            }
        }

        // ገጹ እንደተጫነ ፈንክሽኑን ይጠራል
        document.addEventListener('DOMContentLoaded', initCartelaGrid);
    </script>
</body>
</html>
