<!DOCTYPE html>
<html lang="am">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Ethio Bingo Mini App</title>
  <style>
    :root {
      --bg-dark: #1e2638;
      --card-bg: #f2f5f9;
      --accent-yellow: #f1c40f;
      --accent-green: #2ecc71;
      --accent-purple: #8e44ad;
      --danger-red: #e74c3c;
    }

    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 0; user-select: none; }
    body { background-color: var(--bg-dark); color: #fff; overflow-x: hidden; }

    /* Top Navigation Bar */
    .header-bar { display: flex; justify-content: space-between; align-items: center; padding: 8px 10px; background: #151c28; }
    .status-badge { background: #2c3e50; padding: 4px 8px; border-radius: 8px; text-align: center; font-size: 10px; }
    .status-badge strong { display: block; font-size: 13px; color: #fff; }
    .room-badge { background: var(--accent-yellow); color: #000; font-weight: bold; border-radius: 8px; padding: 8px 10px; font-size: 12px; }
    .balance-badge { background: var(--accent-green); color: #fff; font-weight: bold; border-radius: 8px; padding: 6px 10px; text-align: right; font-size: 10px; }
    .balance-badge span { font-size: 12px; }

    /* SELECTION VIEW */
    #selection-view { padding: 10px; }
    .grid-104 { display: grid; grid-template-columns: repeat(8, 1fr); gap: 4px; background: #e2e8f0; padding: 8px; border-radius: 12px; max-height: 55vh; overflow-y: auto; }
    .num-cell { background: #fff; color: #333; text-align: center; padding: 8px 0; font-weight: bold; font-size: 13px; border-radius: 6px; cursor: pointer; }
    .num-cell.sold { background: #cbd5e1; color: #94a3b8; cursor: not-allowed; }
    .num-cell.selected { background: var(--accent-green); color: #fff; }

    /* Bottom Slots Container */
    .slots-container { display: flex; gap: 10px; padding: 10px; margin-top: 5px; }
    .slot-box { flex: 1; background: var(--card-bg); border-radius: 12px; min-height: 140px; border: 2px dashed #cbd5e1; position: relative; display: flex; align-items: center; justify-content: center; color: #64748b; font-size: 12px; font-weight: bold; }
    .slot-box.active { border: solid 2px var(--accent-green); background: #fff; }
    .delete-btn { position: absolute; top: -8px; right: -8px; background: var(--danger-red); color: white; width: 22px; height: 22px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 12px; cursor: pointer; border: 2px solid #fff; }

    /* Mini Card Table */
    .mini-card-table { width: 100%; border-collapse: collapse; font-size: 10px; color: #333; text-align: center; margin: 4px; }
    .mini-card-table td { border: 1px solid #e2e8f0; padding: 2px; }
    .mini-card-table td.star { color: #f39c12; font-size: 12px; }

    /* GAMEPLAY LIVE VIEW */
    #gameplay-view { display: none; padding: 5px; }
    .game-layout { display: flex; gap: 8px; }
    .master-board { width: 35%; background: #fff; color: #000; border-radius: 6px; padding: 4px; font-size: 9px; }
    .bingo-col-header { display: grid; grid-template-columns: repeat(5, 1fr); background: #2980b9; color: #fff; font-weight: bold; text-align: center; padding: 2px 0; }
    .board-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 2px; margin-top: 2px; }
    .b-cell { background: #f8fafc; text-align: center; padding: 3px 0; font-weight: bold; border-radius: 2px; }
    .b-cell.called { background: var(--accent-yellow); color: #000; }

    .live-cards-area { width: 65%; display: flex; flex-direction: column; gap: 8px; }
    .ball-display-header { display: flex; align-items: center; justify-content: space-between; }
    .current-ball { width: 60px; height: 60px; background: var(--accent-purple); border-radius: 50%; border: 3px solid #fff; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: bold; color: #fff; }

    .bingo-card { background: #fff; border-radius: 8px; overflow: hidden; color: #333; }
    .bingo-card-header { display: grid; grid-template-columns: repeat(5, 1fr); text-align: center; font-weight: bold; color: white; }
    .bingo-card-header div { padding: 2px; }
    .b-h { background: #2980b9; } .i-h { background: #c0392b; } .n-h { background: #f39c12; } .g-h { background: #27ae60; } .o-h { background: #8e44ad; }
    
    .bingo-card-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 2px; padding: 4px; text-align: center; font-weight: bold; font-size: 11px; }
    .c-cell { background: #f1f5f9; padding: 6px 0; border-radius: 4px; }
    .c-cell.dabbed { background: var(--accent-green); color: white; }
    .c-cell.star-cell { background: var(--accent-green); color: white; }

    /* WINNER MODAL */
    .modal-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.8); display: none; align-items: center; justify-content: center; z-index: 100; }
    .modal-card { background: #fff; color: #333; width: 88%; border-radius: 20px; border: 4px solid var(--accent-yellow); padding: 15px; text-align: center; }
    .winner-title { color: #e74c3c; font-size: 22px; font-weight: bold; }
    .prize-pool-box { background: #f8fafc; border-radius: 12px; padding: 8px; margin: 10px 0; border: 1px solid #e2e8f0; }
    .progress-bar-container { background: #e2e8f0; height: 16px; border-radius: 8px; overflow: hidden; margin-top: 10px; }
    .progress-fill { background: var(--accent-yellow); height: 100%; width: 100%; transition: width 1s linear; }
  </style>
</head>
<body>

  <!-- TOP HEADER BAR -->
  <div class="header-bar">
    <div class="room-badge" id="ui-room">ROOM VIP 💰</div>
    <div class="status-badge">SOLD<strong id="ui-sold">12</strong></div>
    <div class="status-badge">TIME<strong id="ui-timer">18s</strong></div>
    <div class="status-badge">CALL<strong id="ui-call-count">0ኛ</strong></div>
    <div class="balance-badge">BALANCE<br><span id="ui-balance">0.00 ETB</span></div>
  </div>

  <!-- VIEW 1: CARD SELECTION -->
  <div id="selection-view">
    <div class="grid-104" id="numbers-grid"></div>

    <div class="slots-container">
      <div class="slot-box" id="slot-1">
        <span>+ SLOT 1 EMPTY</span>
      </div>
      <div class="slot-box" id="slot-2">
        <span>+ SLOT 2 EMPTY</span>
      </div>
    </div>
  </div>

  <!-- VIEW 2: LIVE GAMEPLAY -->
  <div id="gameplay-view">
    <div class="game-layout">
      <div class="master-board">
        <div class="bingo-col-header">
          <div>B</div><div>I</div><div>N</div><div>G</div><div>O</div>
        </div>
        <div class="board-grid" id="master-board-grid"></div>
      </div>

      <div class="live-cards-area">
        <div class="ball-display-header">
          <div>
            <span style="font-size:10px; color:#94a3b8;">DERASH (POOL)</span><br>
            <strong style="color:var(--accent-green)" id="live-derash">0 ETB</strong>
          </div>
          <div class="current-ball" id="current-ball-display">--</div>
        </div>

        <div id="active-user-cards"></div>
      </div>
    </div>
  </div>

  <!-- VIEW 3: WINNER MODAL -->
  <div class="modal-overlay" id="winner-modal">
    <div class="modal-card">
      <h2 class="winner-title" id="winner-status-text">አሸናፊ!</h2>
      <h3 style="color:var(--accent-green); margin:5px 0;" id="winner-name">Congratulations!</h3>
      
      <div class="prize-pool-box">
        <p style="font-size:11px; color:#64748b;">TOTAL PRIZE POOL</p>
        <h2 style="color:var(--accent-green);" id="win-total-prize">0 ETB</h2>
      </div>

      <div class="progress-bar-container">
        <div class="progress-fill" id="next-round-progress"></div>
      </div>
      <p style="font-size:10px; font-weight:bold; margin-top:4px;" id="next-round-text">NEXT ROUND: 15S</p>
    </div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    let userId = urlParams.get('uid') || 'demo';
    let userBalance = parseFloat(urlParams.get('bal')) || 80.0;
    let roomPrice = parseFloat(urlParams.get('room')) || 10.0;
    
    // ኦንላይን ያሉ ተጫዋቾችና የተሸጡ ካርቴላዎች ብዛት
    let totalSoldCards = 12; // በክፍሉ የተሸጡ አጠቃላይ ካርቴላዎች
    let totalPrizePool = totalSoldCards * roomPrice; // አጠቃላይ ደራሽ/የሽልማት ገንዘብ

    let selectedCards = [];
    let calledNumbers = [];
    let timerSeconds = 18;

    document.getElementById('ui-balance').innerText = userBalance.toFixed(2) + " ETB";
    document.getElementById('ui-sold').innerText = totalSoldCards;
    document.getElementById('live-derash').innerText = totalPrizePool.toFixed(2) + " ETB";

    // 🔊 Voice Call Function
    function speakCall(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.rate = 0.85;
        utterance.lang = 'en-US';
        window.speechSynthesis.speak(utterance);
      }
    }

    // Backend Sync
    function syncBalanceToBackend() {
      fetch('/api/sync-balance', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ user_id: userId, balance: userBalance })
      }).catch(err => console.log(err));
    }

    // Grid 1-104
    const gridEl = document.getElementById('numbers-grid');
    for (let i = 1; i <= 104; i++) {
      const cell = document.createElement('div');
      cell.className = 'num-cell';
      cell.innerText = i;
      
      if ([1, 2, 5, 12, 17, 20, 24, 30, 42, 50, 61, 75, 83, 90, 100].includes(i)) {
        cell.classList.add('sold');
      } else {
        cell.onclick = () => selectCardNumber(i, cell);
      }
      gridEl.appendChild(cell);
    }

    // ካርቴላ ሲመረጥ የካርቴላውን ዋጋ ከባላንስ መቀነስ
    function selectCardNumber(num, element) {
      if (selectedCards.includes(num)) {
        selectedCards = selectedCards.filter(n => n !== num);
        element.classList.remove('selected');
        userBalance += roomPrice; // ከተሰረዘ ብሩ ይመለሳል
      } else {
        if (selectedCards.length >= 2) {
          alert("ከ 2 በላይ ካርቴላ መምረጥ አይችሉም!");
          return;
        }
        if (userBalance < roomPrice) {
          alert("በቂ ያልሆነ ባላንስ! እባክዎ አስቀድመው ብር ያስገቡ።");
          return;
        }
        selectedCards.push(num);
        element.classList.add('selected');
        userBalance -= roomPrice; // የካርቴላውን ዋጋ መቀነስ
      }
      
      document.getElementById('ui-balance').innerText = userBalance.toFixed(2) + " ETB";
      syncBalanceToBackend();
      updateSlotsUI();
    }

    function updateSlotsUI() {
      [1, 2].forEach((slotNum, idx) => {
        const slotEl = document.getElementById(`slot-${slotNum}`);
        const cardNum = selectedCards[idx];
        if (cardNum) {
          slotEl.className = "slot-box active";
          slotEl.innerHTML = `
            <div class="delete-btn" onclick="removeCard(${cardNum})">✕</div>
            <div style="width:100%; padding:4px;">
              <div style="font-size:10px; color:blue; font-weight:bold; margin-bottom:2px;">#${cardNum}</div>
              <table class="mini-card-table">
                <tr><td>3</td><td>21</td><td>45</td><td>52</td><td>68</td></tr>
                <tr><td>10</td><td>30</td><td>37</td><td>48</td><td>66</td></tr>
                <tr><td>13</td><td>26</td><td class="star">★</td><td>56</td><td>70</td></tr>
                <tr><td>14</td><td>24</td><td>35</td><td>46</td><td>73</td></tr>
                <tr><td>7</td><td>25</td><td>34</td><td>55</td><td>62</td></tr>
              </table>
            </div>
          `;
        } else {
          slotEl.className = "slot-box";
          slotEl.innerHTML = `<span>+ SLOT ${slotNum} EMPTY</span>`;
        }
      });
    }

    function removeCard(num) {
      selectedCards = selectedCards.filter(n => n !== num);
      document.querySelectorAll('.num-cell').forEach(el => {
        if (parseInt(el.innerText) === num) el.classList.remove('selected');
      });
      userBalance += roomPrice;
      document.getElementById('ui-balance').innerText = userBalance.toFixed(2) + " ETB";
      syncBalanceToBackend();
      updateSlotsUI();
    }

    // Countdown
    const timerInterval = setInterval(() => {
      timerSeconds--;
      document.getElementById('ui-timer').innerText = timerSeconds + "s";
      if (timerSeconds <= 0) {
        clearInterval(timerInterval);
        startLiveGame();
      }
    }, 1000);

    function startLiveGame() {
      if (selectedCards.length === 0) {
        // ካልመረጠ በራሱ 1 ይመርጥና ከባላንስ ይቆርጣል
        selectedCards = [80];
        userBalance -= roomPrice;
        syncBalanceToBackend();
      }
      document.getElementById('selection-view').style.display = 'none';
      document.getElementById('gameplay-view').style.display = 'block';

      initMasterBoard();
      renderLiveCards();
      startBallCaller();
    }

    function initMasterBoard() {
      const mb = document.getElementById('master-board-grid');
      mb.innerHTML = '';
      for (let i = 1; i <= 75; i++) {
        const cell = document.createElement('div');
        cell.className = 'b-cell';
        cell.id = `mb-${i}`;
        cell.innerText = i;
        mb.appendChild(cell);
      }
    }

    function renderLiveCards() {
      const container = document.getElementById('active-user-cards');
      container.innerHTML = '';
      selectedCards.forEach(cardNum => {
        const cardHtml = `
          <div class="bingo-card">
            <div class="bingo-card-header">
              <div class="b-h">B</div><div class="i-h">I</div><div class="n-h">N</div><div class="g-h">G</div><div class="o-h">O</div>
            </div>
            <div class="bingo-card-grid">
              <div class="c-cell" id="c-${cardNum}-3">3</div><div class="c-cell" id="c-${cardNum}-21">21</div><div class="c-cell" id="c-${cardNum}-45">45</div><div class="c-cell" id="c-${cardNum}-52">52</div><div class="c-cell" id="c-${cardNum}-68">68</div>
              <div class="c-cell" id="c-${cardNum}-10">10</div><div class="c-cell" id="c-${cardNum}-30">30</div><div class="c-cell" id="c-${cardNum}-37">37</div><div class="c-cell" id="c-${cardNum}-48">48</div><div class="c-cell" id="c-${cardNum}-66">66</div>
              <div class="c-cell" id="c-${cardNum}-13">13</div><div class="c-cell" id="c-${cardNum}-26">26</div><div class="c-cell star-cell">★</div><div class="c-cell" id="c-${cardNum}-56">56</div><div class="c-cell" id="c-${cardNum}-70">70</div>
              <div class="c-cell" id="c-${cardNum}-14">14</div><div class="c-cell" id="c-${cardNum}-24">24</div><div class="c-cell" id="c-${cardNum}-35">35</div><div class="c-cell" id="c-${cardNum}-46">46</div><div class="c-cell" id="c-${cardNum}-73">73</div>
              <div class="c-cell" id="c-${cardNum}-7">7</div><div class="c-cell" id="c-${cardNum}-25">25</div><div class="c-cell" id="c-${cardNum}-34">34</div><div class="c-cell" id="c-${cardNum}-55">55</div><div class="c-cell" id="c-${cardNum}-62">62</div>
            </div>
          </div>
        `;
        container.innerHTML += cardHtml;
      });
    }

    // 🎙️ Ball Caller Engine
    function startBallCaller() {
      const ballsToCall = [70, 15, 37, 68, 11, 61, 57, 36, 3, 46, 69];
      let idx = 0;

      const ballInterval = setInterval(() => {
        if (idx >= ballsToCall.length) {
          clearInterval(ballInterval);
          finishGame(true); // ተጫዋቹ አሸንፏል
          return;
        }

        const ballNum = ballsToCall[idx];
        calledNumbers.push(ballNum);

        const callOrder = (idx + 1) + "ኛ";
        document.getElementById('ui-call-count').innerText = callOrder;

        let letter = ballNum <= 15 ? 'B' : ballNum <= 30 ? 'I' : ballNum <= 45 ? 'N' : ballNum <= 60 ? 'G' : 'O';
        document.getElementById('current-ball-display').innerText = `${letter}-${ballNum}`;

        const mbCell = document.getElementById(`mb-${ballNum}`);
        if (mbCell) mbCell.classList.add('called');

        selectedCards.forEach(cardNum => {
          const cardCell = document.getElementById(`c-${cardNum}-${ballNum}`);
          if (cardCell) cardCell.classList.add('dabbed');
        });

        speakCall(`${callOrder} call... ${letter}... ${ballNum}`);

        idx++;
      }, 3000);
    }

    // 🏆 ጨዋታው ሲያልቅ (አሸናፊው ከ 80 ብሩ ላይ የሙሉ ተጫዋቾች ገንዘብ ይደመርለታል)
    function finishGame(isWinner) {
      if (isWinner) {
        // አሸናፊ ከሆነ የ 12 ተጫዋቾቹን ገንዘብ (120 ETB) ይወስዳል!
        userBalance += totalPrizePool;
        document.getElementById('ui-balance').innerText = userBalance.toFixed(2) + " ETB";
        document.getElementById('win-total-prize').innerText = totalPrizePool.toFixed(2) + " ETB";
        document.getElementById('winner-status-text').innerText = "🏆 እርሶ አሸንፈዋል!";
        speakCall("Bingo! You won the game!");
      } else {
        // ከተሸነፈ የቆረጠው የካርቴላ ብር ተቀንሶ ቀሪው ይቀራል
        document.getElementById('winner-status-text').innerText = "❌ ሌላ ተጫዋች አሸነፈ";
        document.getElementById('win-total-prize').innerText = "0 ETB";
      }

      // አዲሱን ባላንስ ወደ ቦቱ (Backend) መላክ
      syncBalanceToBackend();

      const modal = document.getElementById('winner-modal');
      modal.style.display = 'flex';

      let nextSecs = 15;
      const progFill = document.getElementById('next-round-progress');
      const progText = document.getElementById('next-round-text');

      const nextInterval = setInterval(() => {
        nextSecs--;
        progText.innerText = `NEXT ROUND: ${nextSecs}S`;
        progFill.style.width = `${(nextSecs / 15) * 100}%`;

        if (nextSecs <= 0) {
          clearInterval(nextInterval);
          window.location.reload();
        }
      }, 1000);
    }
  </script>
</body>
</html>
