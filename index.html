<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GoodBingo Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: white;
            margin: 0;
            padding: 8px;
            text-align: center;
            user-select: none;
        }
        .header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
        }
        .card-stat {
            background: #1e293b;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 10px;
            border: 1px solid #334155;
        }

        /* 1) የካርቴላ መምረጫ ሰንጠረዥ (Selection Grid) */
        #selection-section {
            display: block;
        }
        .grid-container {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            gap: 3px;
            max-height: 200px;
            overflow-y: auto;
            background: #1e293b;
            padding: 6px;
            border-radius: 8px;
            border: 1px solid #334155;
        }
        .grid-item {
            background: #ffffff;
            color: #0f172a;
            padding: 6px 0;
            border-radius: 4px;
            font-weight: bold;
            font-size: 11px;
            cursor: pointer;
        }
        .grid-item.selected { background: #22c55e; color: white; }

        /* 2) ጨዋታው ሲጀምር የሚመጣው የላይቭ ጨዋታክፍል (Live Game Dashboard) */
        #live-game-section {
            display: none; /* በመጀመሪያ የተሰወረ ነው */
            margin-top: 5px;
        }
        .game-layout {
            display: flex;
            gap: 6px;
        }

        /* በጎን በኩል የወጡ ቁጥሮች ማሳያ (Master Board) */
        .master-board-panel {
            flex: 1.2;
            background: #1e293b;
            border-radius: 8px;
            padding: 5px;
            border: 1px solid #334155;
        }
        .master-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 2px;
            max-height: 250px;
            overflow-y: auto;
        }
        .master-cell {
            background: #334155;
            color: #94a3b8;
            font-size: 9px;
            font-weight: bold;
            padding: 4px 0;
            border-radius: 3px;
        }
        /* የወጡ ቁጥሮች በጎን በሰማያዊ/ቢጫ የሚያበሩበት */
        .master-cell.called {
            background: #eab308 !important;
            color: #000 !important;
            font-weight: bold;
            box-shadow: 0 0 5px #eab308;
        }

        /* በጎን በኩል የካርቴላዎች ማሳያ (Cards Panel) */
        .cards-panel {
            flex: 2;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .slot-box {
            background: #1e293b;
            border: 1px dashed #475569;
            border-radius: 8px;
            padding: 4px;
            min-height: 110px;
        }

        /* 5x5 Bingo Card Grid */
        .bingo-header {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 2px;
            font-weight: bold;
            font-size: 9px;
            color: #eab308;
        }
        .bingo-card {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 2px;
        }
        .bingo-cell {
            background: #334155;
            color: white;
            font-weight: bold;
            font-size: 10px;
            padding: 4px 0;
            border-radius: 3px;
            cursor: pointer;
        }
        .bingo-cell.called-match { background: #3b82f6 !important; } /* የወጡ ቁጥሮች በካርቴላው ላይ */
        .bingo-cell.marked { background: #22c55e !important; }
        .bingo-cell.free { background: #f59e0b; }

        .bingo-btn {
            margin-top: 8px;
            width: 100%;
            padding: 12px;
            background: #eab308;
            border: none;
            color: #000;
            font-size: 18px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="card-stat" style="background:#eab308; color:#000;">ROOM<br><b>VIP 💰</b></div>
        <div class="card-stat">SOLD<br><b id="sold-count">0</b></div>
        <div class="card-stat">TIME<br><b id="timer" style="color:#ef4444;">30s</b></div>
        <div class="card-stat" style="background:#22c55e;">BALANCE<br><b>0.00 ETB</b></div>
    </div>

    <!-- ደረጃ 1፦ ካርቴላ መምረጫ ሰንጠረዥ (ታይመሩ ሲያልቅ ይሰወራል) -->
    <div id="selection-section">
        <p style="font-size:11px; color:#94a3b8; margin:2px 0;">እባክዎ እስከ 2 ካርቴላዎችን ይምረጡ፦</p>
        <div class="grid-container" id="grid"></div>
    </div>

    <!-- ደረጃ 2፦ ጨዋታው ሲጀምር የሚመጣው የላይቭ ዳሽቦርድ (የወጡ ቁጥሮች + ካርቴላዎች) -->
    <div id="live-game-section">
        <div style="background:#22c55e; color:#000; padding:4px; font-weight:bold; font-size:12px; border-radius:6px; margin-bottom:6px;">
            የተጠራ ቁጥር፦ <span id="current-num" style="font-size:16px;">--</span>
        </div>

        <div class="game-layout">
            <!-- በጎን የወጡ ቁጥሮች ማሳያ (Master Board 1-75) -->
            <div class="master-board-panel">
                <span style="font-size:9px; color:#94a3b8; display:block; margin-bottom:2px;">የወጡ ቁጥሮች</span>
                <div class="master-grid" id="master-grid"></div>
            </div>

            <!-- በጎን የካርቴላዎች ማሳያ -->
            <div class="cards-panel">
                <div class="slot-box" id="slot1">
                    <span style="color:#94a3b8; font-size:10px;">SLOT 1 EMPTY</span>
                </div>
                <div class="slot-box" id="slot2">
                    <span style="color:#94a3b8; font-size:10px;">SLOT 2 EMPTY</span>
                </div>
            </div>
        </div>
    </div>

    <button class="bingo-btn" onclick="claimBingo()">🔥 BINGO!</button>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        let slotsUsed = 0;
        let selectedCardsData = {};
        let calledNumbers = [];
        let timeLeft = 30;
        let gameStarted = false;
        let timerInterval, callerInterval;

        // 1-100 የመምረጫ ቦርዶችን መፍጠር
        const grid = document.getElementById('grid');
        for (let i = 1; i <= 100; i++) {
            let item = document.createElement('div');
            item.className = 'grid-item';
            item.innerText = i;
            item.onclick = () => selectBoard(i, item);
            grid.appendChild(item);
        }

        // 1-75 በጎን የሚታየውን የወጡ ቁጥሮች Master Board ማዘጋጀት
        const masterGrid = document.getElementById('master-grid');
        for (let i = 1; i <= 75; i++) {
            let mCell = document.createElement('div');
            mCell.className = 'master-cell';
            mCell.innerText = i;
            mCell.id = 'master-' + i;
            masterGrid.appendChild(mCell);
        }

        // 1) 30 ሰከንድ ታይመር
        timerInterval = setInterval(() => {
            timeLeft--;
            document.getElementById('timer').innerText = timeLeft + "s";
            if (timeLeft <= 0) {
                clearInterval(timerInterval);
                startLiveGame(); // ታይመሩ ሲያልቅ ወደ ላይቭ ጨዋታ መቀየር
            }
        }, 1000);

        function getRandomInt(min, max) {
            return Math.floor(Math.random() * (max - min + 1)) + min;
        }

        function generateStandardBingoCard(boardNum, slotId) {
            let cardMatrix = Array(5).fill().map(() => Array(5).fill(0));
            let columns = [[], [], [], [], []];

            while (columns[0].length < 5) { let r = getRandomInt(1, 15); if (!columns[0].includes(r)) columns[0].push(r); }
            while (columns[1].length < 5) { let r = getRandomInt(16, 30); if (!columns[1].includes(r)) columns[1].push(r); }
            while (columns[2].length < 5) { let r = getRandomInt(31, 45); if (!columns[2].includes(r)) columns[2].push(r); }
            while (columns[3].length < 5) { let r = getRandomInt(46, 60); if (!columns[3].includes(r)) columns[3].push(r); }
            while (columns[4].length < 5) { let r = getRandomInt(61, 75); if (!columns[4].includes(r)) columns[4].push(r); }

            let cardHtml = `
                <b style="color:#eab308; font-size:9px;">CARD #${boardNum}</b>
                <div class="bingo-header"><div>B</div><div>I</div><div>N</div><div>G</div><div>O</div></div>
                <div class="bingo-card">`;

            for (let r = 0; r < 5; r++) {
                for (let c = 0; c < 5; c++) {
                    if (r === 2 && c === 2) {
                        cardMatrix[r][c] = "FREE";
                        cardHtml += `<div class="bingo-cell free">★</div>`;
                    } else {
                        let num = columns[c][r];
                        cardMatrix[r][c] = num;
                        cardHtml += `<div class="bingo-cell" id="cell-${slotId}-${r}-${c}" onclick="markCell(this)">${num}</div>`;
                    }
                }
            }
            cardHtml += `</div>`;
            selectedCardsData[slotId] = { boardNum: boardNum, matrix: cardMatrix };
            return cardHtml;
        }

        function selectBoard(num, element) {
            if (gameStarted) return;
            if (element.classList.contains('selected')) return;

            if (slotsUsed < 2) {
                slotsUsed++;
                let slotId = 'slot' + slotsUsed;
                document.getElementById(slotId).innerHTML = generateStandardBingoCard(num, slotId);
                element.classList.add('selected');
                document.getElementById('sold-count').innerText = slotsUsed;
            } else {
                alert("ከ 2 በላይ ካርቴላ መያዝ አይችሉም!");
            }
        }

        function markCell(cell) {
            cell.classList.toggle('marked');
        }

        // 2) ጨዋታው ሲጀምር፦ መምረጫው ጠፍቶ የላይቭ ቦርዱ በጎን ይመጣል
        function startLiveGame() {
            gameStarted = true;
            document.getElementById('selection-section').style.display = 'none'; // መምረጫውን መስወር
            document.getElementById('live-game-section').style.display = 'block'; // የላይቭ ጨዋታ ገጹን ማሳየት

            // በየ 5 ሰከንዱ ቁጥር ጥሪ መጀመር
            callerInterval = setInterval(() => {
                let nextNum;
                do {
                    nextNum = getRandomInt(1, 75);
                } while (calledNumbers.includes(nextNum) && calledNumbers.length < 75);

                if (!calledNumbers.includes(nextNum)) {
                    calledNumbers.push(nextNum);
                    document.getElementById('current-num').innerText = nextNum;
                    
                    // 1. በጎን ባለው Master Board ላይ የወጣውን ቁጥር በቢጫ ማብራት
                    let masterCell = document.getElementById('master-' + nextNum);
                    if (masterCell) masterCell.classList.add('called');

                    // 2. በካርቴላው ላይ ካለ በሰማያዊ ማብራት
                    highlightCardMatch(nextNum);
                }
            }, 5000);
        }

        function highlightCardMatch(num) {
            for (let slotId in selectedCardsData) {
                let matrix = selectedCardsData[slotId].matrix;
                for (let r = 0; r < 5; r++) {
                    for (let c = 0; c < 5; c++) {
                        if (matrix[r][c] === num) {
                            let cell = document.getElementById(`cell-${slotId}-${r}-${c}`);
                            if (cell) cell.classList.add('called-match');
                        }
                    }
                }
            }
        }

        // 3) BINGO Validation
        function checkBingoWinning(slotId) {
            let card = selectedCardsData[slotId];
            if (!card) return false;
            let matrix = card.matrix;
            let markedMatrix = Array(5).fill().map(() => Array(5).fill(false));

            for (let r = 0; r < 5; r++) {
                for (let c = 0; c < 5; c++) {
                    let val = matrix[r][c];
                    if (val === "FREE" || calledNumbers.includes(val)) {
                        markedMatrix[r][c] = true;
                    }
                }
            }

            for (let r = 0; r < 5; r++) { if (markedMatrix[r].every(v => v)) return true; }
            for (let c = 0; c < 5; c++) {
                let colWin = true;
                for (let r = 0; r < 5; r++) { if (!markedMatrix[r][c]) { colWin = false; break; } }
                if (colWin) return true;
            }
            let d1 = true, d2 = true;
            for (let i = 0; i < 5; i++) {
                if (!markedMatrix[i][i]) d1 = false;
                if (!markedMatrix[i][4 - i]) d2 = false;
            }
            return d1 || d2;
        }

        function claimBingo() {
            if (slotsUsed === 0) {
                alert("እባክዎ በመጀመሪያ ቦርድ ይምረጡ!");
                return;
            }
            if (!gameStarted) {
                alert("ጨዋታው ገና አልተጀመረም!");
                return;
            }

            let winnerCardNum = null;
            for (let slotId in selectedCardsData) {
                if (checkBingoWinning(slotId)) {
                    winnerCardNum = selectedCardsData[slotId].boardNum;
                    break;
                }
            }

            if (winnerCardNum !== null) {
                clearInterval(callerInterval);
                alert(`🎉 BINGO!! \n\n🏆 ህጉን ባሟላ መልኩ ካርቴላ ቁጥር #${winnerCardNum} አሸንፏል!`);
                tg.close();
            } else {
                alert("❌ ህጉን አላሟሉም! ካርቴላዎ ገና አልሞላም።");
            }
        }
    </script>
</body>
</html>
