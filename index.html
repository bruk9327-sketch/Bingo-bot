<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auto Bingo Game</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0f172a;
            color: white;
            text-align: center;
            padding: 15px;
        }

        /* አውቶማቲክ አሸናፊ ሲኖር የሚመጣው Pop-Up Banner */
        #winner-banner {
            display: none;
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 20px;
            box-shadow: 0 10px 25px rgba(16, 185, 129, 0.5);
            animation: popIn 0.5s ease-in-out;
        }

        #winner-banner h1 { margin: 0 0 10px 0; font-size: 26px; }
        #winner-banner p { font-size: 18px; margin: 5px 0; }

        @keyframes popIn {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .marked {
            background-color: #10b981 !important;
            color: white !important;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <!-- አውቶማቲክ አሸናፊነት ማስታወቂያ ሰሌዳ -->
    <div id="winner-banner">
        <h1 id="win-title">🏆 BINGO! 🏆</h1>
        <p id="win-details">ተጫዋች አሸንፏል!</p>
        <h2 id="win-payout" style="color: #fef08a;">+80 ETB</h2>
    </div>

    <h2>📢 የተጠራ ቁጥር: <span id="current-call" style="color: #38bdf8;">--</span></h2>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        
        const socket = io();

        // 1. ሰርቨሩ ቁጥር ሲጠራ
        socket.on("number_called", (data) => {
            const calledNum = String(data.number);
            document.getElementById("current-call").innerText = calledNum;

            // በስክሪኑ ላይ ያሉትን ቁጥሮች አውቶማቲክ ማቅለም
            const matchingCells = document.querySelectorAll(`[data-number='${calledNum}']`);
            matchingCells.forEach(cell => cell.classList.add("marked"));
        });

        // 2. ሰርቨሩ አውቶማቲክ አሸናፊ ሲያገኝ የሚቀበለው Event
        socket.on("auto_bingo_winner", (res) => {
            const banner = document.getElementById("winner-banner");
            const winDetails = document.getElementById("win-details");
            const winPayout = document.getElementById("win-payout");

            // አሸናፊውን እና የያዘውን ካርቴላ በጎላ ሁኔታ ማሳየት
            winDetails.innerText = `ተጫዋች፦ ${res.winnerId}\nካርቴላ፦ #${res.cartelaId}\nማሸነፊያ ቁጥር፦ ${res.winningNumber}`;
            winPayout.innerText = `💰 የተጣራ ሽልማት፦ ${res.payout} ETB`;
            
            banner.style.display = "block"; // Banner-ዉን ማሳየት

            // በቴሌግራም አልፋቤት Alert ማሳየት
            tg.showAlert(res.message);
        });
    </script>
</body>
</html>
