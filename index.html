<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GoodBingo Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: white;
            margin: 0;
            padding: 10px;
            text-align: center;
            user-select: none;
        }
        .header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
        }
        .card-stat {
            background: #1e293b;
            padding: 6px 10px;
            border-radius: 8px;
            font-size: 11px;
            border: 1px solid #334155;
        }
        .called-box {
            background: #ef4444;
            color: white;
            padding: 8px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 8px;
            margin-bottom: 8px;
        }
        .grid-container {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            gap: 4px;
            max-height: 180px;
            overflow-y: auto;
            background: #1e293b;
            padding: 6px;
            border-radius: 10px;
        }
        .grid-item {
            background: #ffffff;
            color: #0f172a;
            padding: 6px 0;
            border-radius: 4px;
            font-weight: bold;
            font-size: 12px;
            cursor: pointer;
        }
        .grid-item.selected { background: #22c55e; color: white; }

        /* Slots Area */
        .slots-container {
            display: flex;
            gap: 8px;
            margin-top: 8px;
        }
        .slot-box {
            flex: 1;
            background: #1e293b;
            border: 2px dashed #475569;
            border-radius: 10px;
            padding: 5px;
            min-height: 170px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        
        .bingo-card {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 3px;
            width: 100%;
        }
        .bingo-cell {
            background: #22c55e;
            color: white;
            font-weight: bold;
            font-size: 11px;
            padding: 6px 0;
            border-radius: 4px;
            cursor: pointer;
        }
        .bingo-cell.marked { background: #f59e0b !important; }
        .bingo-cell.free { background: #f59e0b; }

        .bingo-btn {
            margin-top: 10px;
            width: 100%;
            padding: 14px;
            background: #eab308;
            border: none;
            color: #000;
            font-size: 20px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="card-stat" style="background:#eab308; color:#000;">ROOM<br><b>VIP 💰</b></div>
        <div class="card-stat">SOLD<br><b id="sold-count">0</b></div>
        <div class="card-stat">TIME<br><b id="timer" style="color:#ef4444;">30s</b></div>
        <div class="card-stat" style="background:#22c55e;">BALANCE<br><b>0.00 ETB</b></div>
    </div>

    <!-- የተጠራ ቁጥር ማሳያ -->
    <div class="called-box" id="caller-display">
        የተጠራ ቁጥር: <span id="current-num">--</span>
    </div>

    <!-- 1-100 ቁጥሮች -->
    <div class="grid-container" id="grid"></div>

    <!-- Slot 1 & 2 Cards -->
    <div class="slots-container">
        <div class="slot-box" id="slot1">
            <span style="color:#94a3b8; font-size:12px;">+<br>SLOT 1 EMPTY</span>
        </div>
        <div class="slot-box" id="slot2">
            <span style="color:#94a3b8; font-size:12px;">+<br>SLOT 2 EMPTY</span>
        </div>
    </div>

    <button class="bingo-btn" onclick="claimBingo()">🔥 BINGO!</button>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        let slotsUsed = 0;
        let selectedCards = []; // የተያዙ ካርቴላዎች
        let calledNumbers = []; // የተጠሩ ቁጥሮች
        let timeLeft = 30;
        let gameStarted = false;
        let timerInterval, callerInterval;

        // 1-100 ቦርዶችን ማዘጋጀት
        const grid = document.getElementById('grid');
        for (let i = 1; i <= 100; i++) {
            let item = document.createElement('div');
            item.className = 'grid-item';
            item.innerText = i;
            item.onclick = () => selectBoard(i, item);
            grid.appendChild(item);
        }

        // 1) 30 ሰከንድ የቆጠራ ታይመር
        timerInterval = setInterval(() => {
            timeLeft--;
            document.getElementById('timer').innerText = timeLeft + "s";
            if (timeLeft <= 0) {
                clearInterval(timerInterval);
                startGame();
            }
        }, 1000);

        function selectBoard(num, element) {
            if (gameStarted) {
                alert("ጨዋታው ስለተጀመረ አሁን ቁጥር መያዝ አይቻልም!");
                return;
            }
            if (element.classList.contains('selected')) return;

            if (slotsUsed < 2) {
                slotsUsed++;
                selectedCards.push(num);
                let slotId = 'slot' + slotsUsed;
                document.getElementById(slotId).innerHTML = generateBingoCard(num);
                element.classList.add('selected');
                document.getElementById('sold-count').innerText = slotsUsed;
            } else {
                alert("ከ 2 በላይ ካርቴላ መያዝ አይችሉም!");
            }
        }

        // 5x5 ካርቴላ ማመንጫ
        function generateBingoCard(boardNum) {
            let cardHtml = `<b style="color:#eab308; font-size:11px; margin-bottom:4px;">CARD #${boardNum}</b><div class="bingo-card">`;
            for (let r = 1; r <= 25; r++) {
                if (r === 13) {
                    cardHtml += `<div class="bingo-cell free">★</div>`;
                } else {
                    let randomNum = Math.floor(Math.random() * 75) + 1;
                    cardHtml += `<div class="bingo-cell" onclick="markCell(this)">${randomNum}</div>`;
                }
            }
            cardHtml += `</div>`;
            return cardHtml;
        }

        function markCell(cell) {
            cell.classList.toggle('marked');
        }

        // 2) 30sec ሲያልቅ ቁጥር መጥራት መጀመር
        function startGame() {
            gameStarted = true;
            document.getElementById('caller-display').style.background = '#22c55e';
            document.getElementById('caller-display').innerText = "ጨዋታው ተጀምሯል! ቁጥሮች እየተጠሩ ነው...";

            callerInterval = setInterval(() => {
                let nextNum = Math.floor(Math.random() * 75) + 1;
                if (!calledNumbers.includes(nextNum)) {
                    calledNumbers.push(nextNum);
                    document.getElementById('current-num').innerText = nextNum;
                    document.getElementById('caller-display').innerHTML = `የተጠራ ቁጥር: <b style="font-size:24px;">${nextNum}</b>`;
                }
            }, 3000); // በየ 3 ሰከንዱ ቁጥር ይጠራል
        }

        // 3) BINGO ሲባል አሸናፊውን ማስታወቅ
        function claimBingo() {
            if (slotsUsed === 0) {
                alert("እባክዎ በመጀመሪያ ቦርድ ይምረጡ!");
                return;
            }
            if (!gameStarted) {
                alert("ጨዋታው ገና አልተጀመረም! ታይመሩ እስኪያልቅ ይቆዩ።");
                return;
            }

            // አሸናፊውን ካርቴላ ማስታወቅ
            let winningCard = selectedCards[0]; 
            clearInterval(callerInterval);
            
            alert(`🎉 BINGO!! \n\n🏆 ካርቴላ ቁጥር #${winningCard} አሸንፏል! \nመልካም እድል!`);
            tg.close(); // Mini app ን ይዘጋዋል
        }
    </script>
</body>
</html>
