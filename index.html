<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BKBingoHousebot Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            user-select: none;
        }

        body {
            background-color: #111827;
            color: #ffffff;
            padding: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* 1. Header Bar */
        .top-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-width: 480px;
            margin-bottom: 12px;
            gap: 6px;
        }

        .room-badge {
            background: #facc15;
            color: #000000;
            font-size: 11px;
            font-weight: 900;
            padding: 8px 10px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            gap: 2px;
        }

        .stat-box {
            background: #1f2937;
            border-radius: 8px;
            padding: 4px 10px;
            text-align: center;
            flex: 1;
        }

        .stat-title {
            font-size: 8px;
            color: #9ca3af;
            font-weight: bold;
        }

        .stat-val {
            font-size: 13px;
            font-weight: bold;
            color: #ffffff;
        }

        .balance-badge {
            background: #10b981;
            color: #ffffff;
            padding: 6px 10px;
            border-radius: 8px;
            text-align: center;
        }

        .balance-title {
            font-size: 8px;
            font-weight: 900;
        }

        .balance-val {
            font-size: 12px;
            font-weight: 900;
        }

        /* 2. Main Game Layout */
        .game-layout {
            display: flex;
            width: 100%;
            max-width: 480px;
            gap: 10px;
            align-items: flex-start;
        }

        /* Left Board (1-75 Numbers Vertical Table) */
        .left-board {
            width: 125px;
            background: #ffffff;
            border-radius: 6px;
            padding: 4px;
            flex-shrink: 0;
        }

        .left-board-header {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            text-align: center;
            font-size: 9px;
            font-weight: 900;
            color: #0284c7;
            padding-bottom: 3px;
            border-bottom: 1px solid #e5e7eb;
            margin-bottom: 3px;
        }

        .left-board-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 2px;
            text-align: center;
        }

        .board-cell {
            color: #000000;
            font-size: 9px;
            font-weight: bold;
            height: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 2px;
        }

        .board-cell.called-yellow {
            background: #facc15 !important;
            color: #000000 !important;
        }

        /* Right Play Container */
        .right-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        /* Derash & Current Call Circle */
        .call-status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-right: 4px;
        }

        .derash-box {
            display: flex;
            flex-direction: column;
        }

        .derash-title {
            font-size: 9px;
            color: #6b7280;
            font-weight: bold;
        }

        .derash-amount {
            font-size: 15px;
            color: #22c55e;
            font-weight: 900;
        }

        .call-circle {
            width: 58px;
            height: 58px;
            border-radius: 50%;
            background: #7e22ce;
            border: 3px solid #ffffff;
            color: #ffffff;
            font-size: 18px;
            font-weight: 900;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        /* Player Bingo Cards */
        .card-item {
            background: #ffffff;
            border-radius: 10px;
            padding: 4px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }

        .card-header-bingo {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 2px;
            margin-bottom: 4px;
            text-align: center;
            font-weight: 900;
            font-size: 11px;
            color: #ffffff;
        }

        .bg-b { background: #0284c7; border-radius: 4px 0 0 4px; }
        .bg-i { background: #dc2626; }
        .bg-n { background: #f59e0b; }
        .bg-g { background: #16a34a; }
        .bg-o { background: #9333ea; border-radius: 0 4px 4px 0; }

        .card-numbers-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 3px;
        }

        .cell-num {
            background: #f8fafc;
            color: #1e293b;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 11px;
            border-radius: 4px;
        }

        .cell-num.star-cell {
            background: #22c55e;
            color: #ffffff;
            font-size: 13px;
        }

        .cell-num.matched-green {
            background: #22c55e !important;
            color: #ffffff !important;
        }
    </style>
</head>
<body>

    <!-- 1. Header Bar -->
    <div class="top-header">
        <div class="room-badge">ROOM VIP 💰</div>
        <div class="stat-box">
            <div class="stat-title">SOLD</div>
            <div class="stat-val" id="soldVal">228</div>
        </div>
        <div class="stat-box">
            <div class="stat-title">TIME</div>
            <div class="stat-val" id="timeVal">0s</div>
        </div>
        <div class="balance-badge">
            <div class="balance-title">BALANCE</div>
            <div class="balance-val" id="balVal">10.00 ETB</div>
        </div>
    </div>

    <!-- 2. Main Game Layout -->
    <div class="game-layout">
        
        <!-- Left Side Board (1 to 75) -->
        <div class="left-board">
            <div class="left-board-header">
                <div>B</div><div>I</div><div>N</div><div>G</div><div>O</div>
            </div>
            <div class="left-board-grid" id="leftBoardGrid"></div>
        </div>

        <!-- Right Side Player Area -->
        <div class="right-container">
            
            <!-- Derash & Call Circle -->
            <div class="call-status-bar">
                <div class="derash-box">
                    <span class="derash-title">DERASH</span>
                    <span class="derash-amount">1824 ETB</span>
                </div>
                <div class="call-circle" id="currentCall">0-70</div>
            </div>

            <!-- Player Cards Container -->
            <div id="playerCardsContainer" style="display: flex; flex-direction: column; gap: 10px;"></div>

        </div>
    </div>

    <script>
        const tg = window.Telegram ? window.Telegram.WebApp : null;
        if(tg) tg.expand();

        // Parse Balance from Telegram URL
        const urlParams = new URLSearchParams(window.location.search);
        const userBal = parseFloat(urlParams.get('bal')) || 10.00;
        document.getElementById('balVal').innerText = userBal.toFixed(2) + " ETB";

        // 1. Render Left Side 1-75 Grid (Horizontal order like in screenshot: 1 2 3 4 5)
        const leftBoardGrid = document.getElementById('leftBoardGrid');
        for (let i = 1; i <= 75; i++) {
            let div = document.createElement('div');
            div.className = 'board-cell';
            div.innerText = i;
            div.id = 'cell-' + i;

            // #70 ን በስክሪንሾቱ መሰረት በቢጫ ከለር ማድመቅ
            if (i === 70) {
                div.classList.add('called-yellow');
            }

            leftBoardGrid.appendChild(div);
        }

        // 2. Fixed Player Cards Data (Exactly as shown in your screenshot)
        const cardsData = [
            // Card 1
            [
                [3, 21, 45, 52, 68],
                [10, 30, 37, 48, 66],
                [13, 26, "★", 56, 70],
                [14, 24, 35, 46, 73],
                [7, 25, 34, 55, 62]
            ],
            // Card 2
            [
                [3, 21, 45, 52, 68],
                [10, 30, 37, 48, 66],
                [13, 26, "★", 56, 70],
                [14, 24, 35, 46, 73],
                [7, 25, 34, 55, 62]
            ]
        ];

        // 3. Render Cards to UI
        const container = document.getElementById('playerCardsContainer');
        cardsData.forEach(cardGrid => {
            let cardDiv = document.createElement('div');
            cardDiv.className = 'card-item';

            let headerHtml = `
                <div class="card-header-bingo">
                    <div class="bg-b">B</div>
                    <div class="bg-i">I</div>
                    <div class="bg-n">N</div>
                    <div class="bg-g">G</div>
                    <div class="bg-o">O</div>
                </div>
            `;

            let gridHtml = '<div class="card-numbers-grid">';
            for (let r = 0; r < 5; r++) {
                for (let c = 0; c < 5; c++) {
                    let val = cardGrid[r][c];
                    let isStar = (val === "★") ? "star-cell" : "";
                    let is70 = (val === 70) ? "matched-green" : "";
                    
                    gridHtml += `<div class="cell-num ${isStar} ${is70}">${val}</div>`;
                }
            }
            gridHtml += '</div>';

            cardDiv.innerHTML = headerHtml + gridHtml;
            container.appendChild(cardDiv);
        });
    </script>
</body>
</html>
