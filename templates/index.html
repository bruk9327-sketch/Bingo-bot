<!DOCTYPE html>
<html lang="am">
<head>
           <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BKBINGO Pro</title>
    <!-- የ Tailwind CSS ሊንክ በትክክል ማስገባት -->
            <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; background: #0f172a; color: #fff; min-height: 100vh; }
        .glass-panel { background: rgba(30, 41, 59, 0.85); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .gold-gradient-text { background: linear-gradient(135deg, #fef08a 0%, #facc15 50%, #ca8a04 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
 
            
            <!-- የተስተካከለ ብቸኛ ሄደር እና የዲፖዚት አዝራር -->
<div class="relative overflow-hidden rounded-2xl mt-1 mb-2 border border-purple-500/35 glass-panel">
    <div class="p-3 flex justify-between items-center">
        <div class="flex items-center gap-2">
            <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-purple-600 to-amber-400 flex items-center justify-center font-black text-lg shadow-lg">🎯</div>
            <div>
                <h1 class="font-orbitron text-base font-black gold-gradient-text tracking-wider">BKBINGO PRO</h1>
                <p class="text-[9px] text-purple-300/80">LIVE CASINO BINGO</p>
            </div>
        </div>
        <div class="flex items-center gap-2">
            <div class="bg-slate-800/80 border border-slate-700 px-2 py-1 rounded-xl flex items-center gap-1">
                <span class="text-[9px] text-slate-300 font-bold">Auto</span>
                <input type="checkbox" id="auto-daub-toggle" class="w-4 h-4 accent-emerald-500 cursor-pointer" onchange="toggleAutoDaub(this)">
            </div>
            <!-- ንቁ የሆነው የባላንስ እና የዲፖዚት አዝራር -->
            <div class="bg-emerald-500/20 border border-emerald-500/40 px-2.5 py-1 rounded-xl text-right flex items-center gap-2">
                <div>
                    <div class="text-[9px] text-emerald-300 font-bold">ሒሳብ (BAL)</div>
                    <div id="user-balance-disp" class="text-xs font-black text-emerald-400">10.00 ETB</div>
                </div>
                <button onclick="openDepositModal()" class="bg-emerald-500 hover:bg-emerald-400 text-slate-950 px-2.5 py-1.5 rounded-lg text-[11px] font-black shadow-lg transition-all cursor-pointer z-20">+ ጫን</button>
            </div>
        </div>
    </div>
</div>

<!-- የዲፖዚት (Deposit) ፖፕ-አፕ ሞዳል -->
<div id="deposit-modal" class="fixed inset-0 bg-slate-950/90 backdrop-blur-md flex items-center justify-center p-4 hidden z-50">
    <div class="glass-panel text-white rounded-3xl p-5 w-full max-w-sm border-2 border-emerald-500 shadow-2xl">
        <div class="flex justify-between items-center mb-3">
            <h3 class="text-sm font-black text-emerald-400">💳 አካውንትዎ ላይ ብር ይጫኑ</h3>
            <button onclick="closeDepositModal()" class="text-slate-400 hover:text-white font-bold text-base cursor-pointer">✕</button>
        </div>
        
        <div class="space-y-3 text-left">
            <div>
                <label class="text-[10px] text-slate-300 font-bold block mb-1">የክፍያ መንገድ ይምረጡ</label>
                <select id="pay-method" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2 text-xs text-white">
                    <option value="Telebirr">Telebirr (ቴሌብር)</option>
                    <option value="CBE">Commercial Bank of Ethiopia (ንግድ ባንክ)</option>
                </select>
            </div>

            <div class="bg-slate-900/80 p-2.5 rounded-xl border border-slate-800 text-[11px] text-slate-300">
                <p class="font-bold text-amber-400 mb-1">📌 የሂሳብ ቁጥር / አካውንት:</p>
                <p>• ቴሌብር (Telebirr): <span class="font-black text-white">09xxxxxxxx</span></p>
                <p>• ንግድ ባንክ (CBE): <span class="font-black text-white">1000xxxxxxxx</span></p>
            </div>

            <div>
                <label class="text-[10px] text-slate-300 font-bold block mb-1">የሚጫኑትን መጠን (ETB)</label>
                <input type="number" id="deposit-amount" placeholder="ለምሳሌ: 50" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2 text-xs text-white">
            </div>

            <div>
                <label class="text-[10px] text-slate-300 font-bold block mb-1">የክፍያ ማረጋገጫ (Transaction ID / Ref)</label>
                <input type="text" id="deposit-txref" placeholder="የባንኩን ወይም የቴሌብር ትራንዛክሽን ቁጥር ያስገቡ" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2 text-xs text-white">
            </div>

            <button onclick="submitDeposit()" class="w-full py-2.5 bg-gradient-to-r from-emerald-500 to-green-600 text-slate-950 font-black text-xs rounded-xl shadow-lg shadow-emerald-500/20 mt-2 cursor-pointer">
                ክፍያ አረጋግጥ (Submit Deposit)
            </button>
        </div>
    </div>
</div>


    <script>
        const sounds = {
            click: new Audio('https://assets.mixkit.co/active_storage/sfx/2568/2568-preview.mp3'),
            win: new Audio('https://assets.mixkit.co/active_storage/sfx/2701/2701-preview.mp3'),
            error: new Audio('https://assets.mixkit.co/active_storage/sfx/2572/2572-preview.mp3')
        };

        function playSound(name) {
            if (sounds[name]) {
                sounds[name].currentTime = 0;
                sounds[name].volume = 0.5;
                sounds[name].play().catch(e => console.log(e));
            }
        }

        let speechUnlocked = false;
        let isAutoDaubEnabled = false;

        function toggleAutoDaub(cb) { isAutoDaubEnabled = cb.checked; playSound('click'); }
        function enableAudioSystem() {
            if ('speechSynthesis' in window) {
                const u = new SpeechSynthesisUtterance("ድምፅ ተጀምሯል");
                u.lang = 'am-ET';
                window.speechSynthesis.speak(u);
                speechUnlocked = true;
                document.getElementById('audio-banner').style.display = 'none';
            }
        }

        function speakNumber(ballNum) {
            if (!('speechSynthesis' in window)) return;
            let letter = ballNum <= 15 ? 'ቢ' : (ballNum <= 30 ? 'አይ' : (ballNum <= 45 ? 'ኤን' : (ballNum <= 60 ? 'ጂ' : 'ኦ')));
            try {
                window.speechSynthesis.cancel();
                const u = new SpeechSynthesisUtterance(`${letter} ${ballNum}`);
                u.lang = 'am-ET';
                u.rate = 0.85;
                window.speechSynthesis.speak(u);
            } catch(e) {}
        }

        const socket = io();
        let userId = null;
        let takenCards = [];

        if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initDataUnsafe?.user) {
            userId = parseInt(window.Telegram.WebApp.initDataUnsafe.user.id);
            window.Telegram.WebApp.expand();
        } else {
            const urlParams = new URLSearchParams(window.location.search);
            userId = parseInt(urlParams.get('user_id')) || Math.floor(Math.random() * 1000000);
        }

        let mySelectedCards = [];
        let drawnNumbersSet = new Set();
        let markedNumbersMap = {};
        let cardsDatabase = {};

        socket.on('connect', () => {
            socket.emit('get_user_balance', { user_id: userId });
        });

        socket.on('balance_update', (data) => {
            if(parseInt(data.user_id) === userId) {
                document.getElementById('user-balance-disp').innerText = `${parseFloat(data.balance).toFixed(2)} ETB`;
            }
        });

        socket.on('error_msg', (data) => {
            playSound('error');
            alert("⚠️ " + data.msg);
        });

        socket.on('bingo_response', (data) => {
            if (data.status === 'success') playSound('win');
            else playSound('error');
            alert(data.message);
        });

        function getFrontendLetterAndDisplay(num) {
            return num <= 15 ? `B-${num}` : (num <= 30 ? `I-${num}` : (num <= 45 ? `N-${num}` : (num <= 60 ? `G-${num}` : `O-${num}`)));
        }

        function init75Grid() {
            const grid = document.getElementById('bingo-75-grid');
            grid.innerHTML = '';
            for(let i=1; i<=75; i++) {
                const cell = document.createElement('div');
                cell.id = `ball-cell-${i}`;
                cell.className = 'p-1 bg-slate-800/80 rounded text-slate-400 font-bold text-[9px]';
                cell.innerText = getFrontendLetterAndDisplay(i);
                grid.appendChild(cell);
            }
        }

        function initCartelaGrid() {
            const gridContainer = document.getElementById('cartela-grid');
            gridContainer.innerHTML = '';
            for (let i = 1; i <= 104; i++) {
                const btn = document.createElement('button');
                const isSelected = mySelectedCards.includes(i);
                const isTaken = takenCards.includes(i) && !isSelected;

                if (isTaken) {
                    btn.className = 'p-2 text-xs font-black rounded-xl border card-btn-taken';
                    btn.disabled = true;
                } else if (isSelected) {
                    btn.className = 'p-2 text-xs font-black rounded-xl border card-btn-selected';
                } else {
                    btn.className = 'p-2 text-xs font-black rounded-xl border bg-slate-800/80 text-slate-200 border-slate-700/60 active:scale-95';
                    btn.onclick = () => {
                        if (mySelectedCards.length >= 2) {
                            playSound('error');
                            return alert("⚠️ በአንድ ዙር ቢበዛ 2 ካርቴላ ብቻ መግዛት ይቻላል!");
                        }
                        playSound('click');
                        socket.emit('select_card', { user_id: userId, card_id: i });
                    };
                }
                btn.innerText = i;
                gridContainer.appendChild(btn);
            }
        }

        socket.on('update_selected_cards', (data) => {
            takenCards = data.taken_cards || [];
            initCartelaGrid();
        });

        socket.on('card_confirmed', (data) => {
            playSound('click');
            if(!mySelectedCards.includes(data.card_id)) mySelectedCards.push(data.card_id);
            cardsDatabase[data.card_id] = data.matrix;
            if(!markedNumbersMap[data.card_id]) markedNumbersMap[data.card_id] = new Set();
            initCartelaGrid();
            renderPreviewCards();
            document.getElementById('user-balance-disp').innerText = `${parseFloat(data.new_balance).toFixed(2)} ETB`;
        });

        function createCardHTML(cid, matrix, isPlayMode = false) {
            const cardDiv = document.createElement('div');
            cardDiv.className = 'glass-panel p-3 rounded-2xl w-full border border-slate-700/80';
            cardDiv.innerHTML = `<div class="text-xs font-black text-amber-400 mb-2 text-center">ካርቴላ #${cid}</div>`;

            const mGrid = document.createElement('div');
            mGrid.className = 'grid grid-cols-5 gap-1 text-center font-bold text-xs bg-slate-950/80 p-2 rounded-xl mb-2.5';

            ['B','I','N','G','O'].forEach((h, idx) => {
                const cls = ['bingo-header-b','bingo-header-i','bingo-header-n','bingo-header-g','bingo-header-o'][idx];
                const hCell = document.createElement('div');
                hCell.className = `p-1 rounded-lg font-black text-[11px] ${cls}`;
                hCell.innerText = h;
                mGrid.appendChild(hCell);
            });

            matrix.forEach(row => {
                row.forEach(val => {
                    const cell = document.createElement('div');
                    if(isPlayMode) cell.id = `card-${cid}-val-${val}`;
                    const isFree = val === 'FREE';
                    const isMarked = isFree || (markedNumbersMap[cid] && markedNumbersMap[cid].has(val));

                    cell.className = `rounded-lg bingo-cell-custom transition-all ${isFree ? 'bg-amber-500 text-slate-950 font-black text-[12px]' : (isMarked ? 'bingo-hit' : 'bg-slate-800/90 text-slate-250 cursor-pointer')}`;
                    cell.innerText = val;

                    if (isPlayMode && !isFree) {
                        cell.onclick = () => {
                            if (!drawnNumbersSet.has(val)) {
                                playSound('error');
                                return alert("⚠️ ይህ ቁጥር ገና አልተጠራም!");
                            }
                            playSound('click');
                            if (!markedNumbersMap[cid]) markedNumbersMap[cid] = new Set();
                            markedNumbersMap[cid].add(val);
                            cell.className = 'rounded-lg bingo-cell-custom bingo-hit scale-105 transition-all';
                        };
                    }
                    mGrid.appendChild(cell);
                });
            });

            cardDiv.appendChild(mGrid);

            if (isPlayMode) {
                const claimBtn = document.createElement('button');
                claimBtn.className = 'w-full py-2 bg-gradient-to-r from-emerald-500 to-green-600 text-slate-950 font-black text-xs rounded-xl shadow-lg shadow-emerald-500/20 border border-emerald-400/50 active:scale-95';
                claimBtn.innerHTML = `🎉 BINGO ለካርቴላ #${cid}`;
                claimBtn.onclick = () => {
                    playSound('click');
                    const matrixData = cardsDatabase[cid];
                    const markedSet = markedNumbersMap[cid] || new Set();
                    let boardValidationMatrix = matrixData.map(row => row.map(val => val === 'FREE' || markedSet.has(val)));
                    socket.emit('claim_bingo', { user_id: userId, card_id: cid, board: boardValidationMatrix });
                };
                cardDiv.appendChild(claimBtn);
            }
            return cardDiv;
        }

        function renderPreviewCards() {
            const container = document.getElementById('preview-cards-container');
            container.innerHTML = '';
            mySelectedCards.forEach(cid => container.appendChild(createCardHTML(cid, cardsDatabase[cid], false)));
        }

        socket.on('timer_update', (data) => {
            document.getElementById('timer').innerText = `${data.time_left}s`;
            document.getElementById('sold-count').innerText = data.sold_count;
        });

        socket.on('game_started', (data) => {
            drawnNumbersSet.clear();
            markedNumbersMap = {};
            mySelectedCards.forEach(cid => markedNumbersMap[cid] = new Set());
            init75Grid();
            document.getElementById('selection-screen').classList.add('hidden');
            document.getElementById('game-screen').classList.remove('hidden');
            document.getElementById('derash-amount').innerText = `${parseFloat(data.derash).toFixed(2)} ETB`;
            
            const container = document.getElementById('my-cards-container');
            container.innerHTML = '';
            mySelectedCards.forEach(cid => container.appendChild(createCardHTML(cid, cardsDatabase[cid], true)));
        });

        socket.on('new_number', (data) => {
            drawnNumbersSet.add(data.ball);
            speakNumber(data.ball);

            const ballEl = document.getElementById('current-ball');
            ballEl.innerText = data.display;
            document.getElementById('game-balls-count').innerText = `${drawnNumbersSet.size}/75`;
            
            const cell75 = document.getElementById(`ball-cell-${data.ball}`);
            if(cell75) cell75.className = 'p-1 bg-amber-400 text-slate-950 font-black rounded shadow-lg scale-105 transition-all text-[9px]';

            if (isAutoDaubEnabled) {
                mySelectedCards.forEach(cid => {
                    if (cardsDatabase[cid]) {
                        cardsDatabase[cid].forEach(row => {
                            row.forEach(val => {
                                if (val === data.ball) {
                                    if (!markedNumbersMap[cid]) markedNumbersMap[cid] = new Set();
                                    markedNumbersMap[cid].add(val);
                                    const cellEl = document.getElementById(`card-${cid}-val-${val}`);
                                    if (cellEl) cellEl.className = 'rounded-lg bingo-cell-custom bingo-hit scale-105 transition-all';
                                }
                            });
                        });
                    }
                });
            }
        });

        socket.on('winner_announced', (data) => {
            playSound('win');
            document.getElementById('winner-name').innerText = `${data.winner_name} አሸንፏል!`;
            document.getElementById('winner-prize').innerText = `${parseFloat(data.prize).toFixed(2)} ETB`;
            const wGrid = document.getElementById('winner-card-matrix');
            wGrid.innerHTML = '';
            if(data.card_matrix) wGrid.appendChild(createCardHTML(data.card_id, data.card_matrix, false));
            document.getElementById('winner-modal').classList.remove('hidden');
        });

        socket.on('reset_game', () => {
            mySelectedCards = [];
            takenCards = [];
            drawnNumbersSet.clear();
            markedNumbersMap = {};
            document.getElementById('winner-modal').classList.add('hidden');
            document.getElementById('game-screen').classList.add('hidden');
            document.getElementById('selection-screen').classList.remove('hidden');
            document.getElementById('preview-cards-container').innerHTML = '';
            initCartelaGrid();
            socket.emit('get_user_balance', { user_id: userId });
        });

        initCartelaGrid();
    </script>
</body>
</html>
