<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BKBINGO Pro</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; background: #0f172a; color: #fff; min-height: 100vh; }
        .glass-panel { background: rgba(30, 41, 59, 0.85); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .gold-gradient-text { background: linear-gradient(135deg, #fef08a 0%, #facc15 50%, #ca8a04 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    </style>
</head>
<body class="p-3 max-w-md mx-auto">

    <!-- የተስተካከለ ብቸኛ ሄደር እና የዲፖዚት አዝራር -->
    <div class="relative overflow-hidden rounded-2xl mt-1 mb-2 border border-purple-500/35 glass-panel">
        <div class="p-3 flex justify-between items-center">
            <div class="flex items-center gap-2">
                <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-purple-600 to-amber-400 flex items-center justify-center font-black text-lg shadow-lg">🎯</div>
                <div>
                    <h1 class="font-orbitron text-base font-black gold-gradient-text tracking-wider">BKBINGO PRO</h1>
                    <p class="text-[9px] text-purple-300/80">LIVE CASINO BINGO</p>
                </div>
            </div>
            <div class="flex items-center gap-2">
                <div class="bg-slate-800/80 border border-slate-700 px-2 py-1 rounded-xl flex items-center gap-1">
                    <span class="text-[9px] text-slate-300 font-bold">Auto</span>
                    <input type="checkbox" id="auto-daub-toggle" class="w-4 h-4 accent-emerald-500 cursor-pointer" onchange="toggleAutoDaub(this)">
                </div>
                <!-- ንቁ የሆነው የባላንስ እና የዲፖዚት አዝራር -->
                <div class="bg-emerald-500/20 border border-emerald-500/40 px-2.5 py-1 rounded-xl text-right flex items-center gap-2">
                    <div>
                        <div class="text-[9px] text-emerald-300 font-bold">ሒሳብ (BAL)</div>
                        <div id="user-balance-disp" class="text-xs font-black text-emerald-400">10.00 ETB</div>
                    </div>
                    <button onclick="openDepositModal()" class="bg-emerald-500 hover:bg-emerald-400 text-slate-950 px-2.5 py-1.5 rounded-lg text-[11px] font-black shadow-lg transition-all cursor-pointer z-20">+ ጫን</button>
                </div>
            </div>
        </div>
    </div>

    <!-- የዲፖዚት (Deposit) ፖፕ-አፕ ሞዳል -->
    <div id="deposit-modal" class="fixed inset-0 bg-slate-950/90 backdrop-blur-md flex items-center justify-center p-4 hidden z-50">
        <div class="glass-panel text-white rounded-3xl p-5 w-full max-w-sm border-2 border-emerald-500 shadow-2xl">
            <div class="flex justify-between items-center mb-3">
                <h3 class="text-sm font-black text-emerald-400">💳 አካውንትዎ ላይ ብር ይጫኑ</h3>
                <button onclick="closeDepositModal()" class="text-slate-400 hover:text-white font-bold text-base cursor-pointer">✕</button>
            </div>
            
            <div class="space-y-3 text-left">
                <div>
                    <label class="text-[10px] text-slate-300 font-bold block mb-1">የክፍያ መንገድ ይምረጡ</label>
                    <select id="pay-method" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2 text-xs text-white">
                        <option value="Telebirr">Telebirr (ቴሌብር)</option>
                        <option value="CBE">Commercial Bank of Ethiopia (ንግድ ባንክ)</option>
                    </select>
                </div>

                <div class="bg-slate-900/80 p-2.5 rounded-xl border border-slate-800 text-[11px] text-slate-300">
                    <p class="font-bold text-amber-400 mb-1">📌 የሂሳብ ቁጥር / አካውንት:</p>
                    <p>• ቴሌብር (Telebirr): <span class="font-black text-white">09xxxxxxxx</span></p>
                    <p>• ንግድ ባንክ (CBE): <span class="font-black text-white">1000xxxxxxxx</span></p>
                </div>

                <div>
                    <label class="text-[10px] text-slate-300 font-bold block mb-1">የሚጫኑትን መጠን (ETB)</label>
                    <input type="number" id="deposit-amount" placeholder="ለምሳሌ: 50" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2 text-xs text-white">
                </div>

                <div>
                    <label class="text-[10px] text-slate-300 font-bold block mb-1">የክፍያ ማረጋገጫ (Transaction ID / Ref)</label>
                    <input type="text" id="deposit-txref" placeholder="የባንኩን ወይም የቴሌብር ትራንዛክሽን ቁጥር ያስገቡ" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2 text-xs text-white">
                </div>

                <button onclick="submitDeposit()" class="w-full py-2.5 bg-gradient-to-r from-emerald-500 to-green-600 text-slate-950 font-black text-xs rounded-xl shadow-lg shadow-emerald-500/20 mt-2 cursor-pointer">
                    ክፍያ አረጋግጥ (Submit Deposit)
                </button>
            </div>
        </div>
    </div>

    <!-- Selection Screen & Game Screen Containers (እንደ መጀመሪያው) -->
    <div id="selection-screen">
        <!-- ሌሎች የካርቴላ መምረጫ ቦታዎች -->
    </div>

    <script>
        const sounds = {
            click: new Audio('https://assets.mixkit.co/active_storage/sfx/2568/2568-preview.mp3'),
            win: new Audio('https://assets.mixkit.co/active_storage/sfx/2701/2701-preview.mp3'),
            error: new Audio('https://assets.mixkit.co/active_storage/sfx/2572/2572-preview.mp3')
        };

        function playSound(name) {
            if (sounds[name]) {
                sounds[name].currentTime = 0;
                sounds[name].volume = 0.5;
                sounds[name].play().catch(e => console.log(e));
            }
        }

        let speechUnlocked = false;
        let isAutoDaubEnabled = false;

        function toggleAutoDaub(cb) { isAutoDaubEnabled = cb.checked; playSound('click'); }
        
        function openDepositModal() {
            playSound('click');
            document.getElementById('deposit-modal').classList.remove('hidden');
        }

        function closeDepositModal() {
            playSound('click');
            document.getElementById('deposit-modal').classList.add('hidden');
        }

        function submitDeposit() {
            const amount = parseFloat(document.getElementById('deposit-amount').value);
            const txRef = document.getElementById('deposit-txref').value.trim();
            const method = document.getElementById('pay-method').value;

            if (!amount || amount <= 0) {
                playSound('error');
                return alert("⚠️ እባክዎ ትክክለኛ የገንዘብ መጠን ያስገቡ!");
            }
            if (!txRef) {
                playSound('error');
                return alert("⚠️ እባክዎ የትራንዛክሽን ማረጋገጫ ቁጥር (Transaction ID) ያስገቡ!");
            }

            socket.emit('request_deposit', {
                user_id: userId,
                amount: amount,
                tx_ref: txRef,
                method: method
            });

            closeDepositModal();
        }

        const socket = io();
        let userId = null;
        let takenCards = [];

        if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initDataUnsafe?.user) {
            userId = parseInt(window.Telegram.WebApp.initDataUnsafe.user.id);
            window.Telegram.WebApp.expand();
        } else {
            const urlParams = new URLSearchParams(window.location.search);
            userId = parseInt(urlParams.get('user_id')) || Math.floor(Math.random() * 1000000);
        }

        let mySelectedCards = [];
        let drawnNumbersSet = new Set();
        let markedNumbersMap = {};
        let cardsDatabase = {};

        socket.on('connect', () => {
            socket.emit('get_user_balance', { user_id: userId });
        });

        socket.on('balance_update', (data) => {
            if(parseInt(data.user_id) === userId) {
                document.getElementById('user-balance-disp').innerText = `${parseFloat(data.balance).toFixed(2)} ETB`;
            }
        });

        socket.on('deposit_success', (data) => {
            playSound('win');
            alert(data.msg);
            document.getElementById('user-balance-disp').innerText = `${parseFloat(data.new_balance).toFixed(2)} ETB`;
            document.getElementById('deposit-amount').value = '';
            document.getElementById('deposit-txref').value = '';
        });

        socket.on('error_msg', (data) => {
            playSound('error');
            alert("⚠️ " + data.msg);
        });
    </script>
</body>
</html>
