<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <title>Admin Sign In - BKBINGO PRO</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0f172a;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-card {
            background: #1e293b;
            padding: 40px;
            border-radius: 12px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            border: 1px solid #334155;
        }
        .login-card h2 { margin-top: 0; text-align: center; color: #38bdf8; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-size: 14px; color: #94a3b8; }
        .form-group input {
            width: 100%;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #475569;
            background: #0f172a;
            color: #fff;
            box-sizing: border-box;
            outline: none;
        }
        .form-group input:focus { border-color: #2563eb; }
        .btn-login {
            width: 100%;
            padding: 12px;
            background: #2563eb;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        .btn-login:hover { background: #1d4ed8; }
        .error-msg { color: #ef4444; font-size: 13px; text-align: center; margin-bottom: 15px; }
    </style>
</head>
<body>
    <div class="login-card">
        <h2>🛡️ BKBINGO Admin</h2>
        <p style="text-align: center; color: #94a3b8; font-size: 13px; margin-bottom: 25px;">እባክዎ ለመግባት መረጃዎትን ያስገቡ</p>
        
        {% if error %}
        <div class="error-msg">{{ error }}</div>
        {% endif %}

        <!-- ትክክለኛው አድራሻ /admin-login ተደርጎ ተስተካክሏል -->
        <form method="POST" action="/admin-login">
            <div class="form-group">
                <label>የአስተዳዳሪ ስም ወይም ዩዘርኔም (Username)</label>
                <input type="text" name="username" required autocomplete="off">
            </div>
            <div class="form-group">
                <label>የሚስጥር ቁጥር (Password)</label>
                <input type="password" name="password" required>
            </div>
            <button type="submit" class="btn-login">ግባ (Sign In)</button>
        </form>
    </div>
</body>
</html>
